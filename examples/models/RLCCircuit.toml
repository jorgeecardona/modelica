summary = "A series RLC circuit stepped with 1 V: two coupled states, an underdamped ring-down."
teaches = ["two states from two components", "a coupled linear system", "connect"]
requires = ["Electrical"]

[parse]
classes = ["RLCCircuit"]

[flatten]
model = "RLCCircuit"
states = ["l.i", "c.v"]
index = 1
balanced = true

# R=L=C=1: omega_0 = 1 rad/s, zeta = 0.5, so it rings and settles at c.v = 1 V.
[simulate]
stop = 10.0
tolerance = 1e-10

[[simulate.point]]
t = 1.0
values = { "l.i" = 0.533507195115, "c.v" = 0.340299846608 }
rtol = 1e-6
source = "reference"

[[simulate.point]]
t = 3.0
values = { "l.i" = 0.133242644018, "c.v" = 1.12435476741 }
rtol = 1e-6
source = "reference"

[[simulate.point]]
t = 5.0
values = { "l.i" = -0.0879424207324, "c.v" = 1.07459056659 }
rtol = 1e-6
source = "reference"

[[simulate.point]]
t = 10.0
values = { "l.i" = 0.00538548061606, "c.v" = 1.00217011674 }
rtol = 1e-6
source = "reference"

[[simulate.invariant]]
expr = "r.v + l.v + c.v"
value = 1.0
atol = 1e-8

# --------------------------------------------------------------------------------------
# The same argument with one more state: no current flows at rest, so the inductor carries
# none and the capacitor holds the source. Independent of R, L and C.
# --------------------------------------------------------------------------------------
[steady]
values = { "l.i" = 0.0, "c.v" = 1.0 }
atol = 1e-9
source = "analytic"
