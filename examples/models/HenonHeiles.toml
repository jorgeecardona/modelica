summary = "The Henon-Heiles system: a star moving in the plane of an axisymmetric galaxy, the two-degree-of-freedom Hamiltonian introduced to ask whether such an orbit has a third integral of motion. The potential 0.5*(x^2 + y^2) + x^2*y - y^3/3 is a harmonic well with a cubic distortion that couples the two coordinates and opens three escape channels at the energy 1/6. Below that the motion is bounded inside a triangular well: quasi-periodic and regular at low energy, mixing into chaos as the energy rises toward escape. Run here at energy 0.1125, a regular orbit that two good integrators reproduce point for point over fifty time units. Its reason for being in the corpus is the same as Kepler's: the energy is a conserved quantity the integrator must hold, and on a Hamiltonian system it is the invariant, not the trajectory, that measures the scheme."
teaches = ["a two-degree-of-freedom Hamiltonian with a cubic coupling potential", "energy conservation as the invariant that grades a conservative integration", "bounded motion below the escape energy 1/6, regular at this energy", "a second Hamiltonian benchmark beside Kepler, non-integrable rather than closed-form"]
requires = []

[parse]
classes = ["HenonHeiles"]

[flatten]
model = "HenonHeiles"
states = ["x", "y", "px", "py"]
equations = 4
balanced = true

# Hamilton's equations for H = 0.5*(px^2 + py^2) + 0.5*(x^2 + y^2) + x^2*y - y^3/3 at unit mass:
#   d(x)/dt = px,  d(y)/dt = py
#   d(px)/dt = -x - 2*x*y      (= -dV/dx)
#   d(py)/dt = -y - x^2 + y^2  (= -dV/dy)
# From (x, y) = (0, 0) with (px, py) = (0.45, 0.15) the energy is 0.1125, below the escape energy
# 1/6 = 0.1667, so the orbit stays inside the triangular well (|x|, |y| < 0.55). This orbit is
# regular: Radau at 1e-11 and a reference at 1e-12 stay within 3e-6 of each other over the whole
# run rather than diverging, which is why the points below carry an absolute tolerance a little
# above that. The energy is conserved -- Radau holds it to 1e-13 -- and is the headline invariant.
[simulate]
stop = 50.0
tolerance = 1e-11

# Points spread over the run: two integrators of different families agree at all of them, the mark
# of a regular (non-chaotic) orbit. The absolute tolerance covers the small method-to-method gap.
[[simulate.point]]
t = 2.0
values = { x = 0.338666519, y = 0.02269753326, px = -0.2540349765, py = -0.2001430726 }
rtol = 1e-5
atol = 1e-5
source = "reference"

[[simulate.point]]
t = 5.0
values = { x = -0.5326419749, y = -0.1502967712, px = 0.02582904105, py = 0.03245798918 }
rtol = 1e-5
atol = 1e-5
source = "reference"

[[simulate.point]]
t = 10.0
values = { x = -0.02117490284, y = -0.151423824, px = -0.4389104993, py = -0.08246896519 }
rtol = 1e-5
atol = 1e-5
source = "reference"

[[simulate.point]]
t = 20.0
values = { x = -0.334072756, y = -0.2786956065, px = 0.2838270761, py = 0.0542464862 }
rtol = 1e-5
atol = 1e-5
source = "reference"

[[simulate.point]]
t = 35.0
values = { x = -0.08942512456, y = 0.1291273099, px = 0.3077377832, py = 0.324032228 }
rtol = 1e-5
atol = 1e-5
source = "reference"

[[simulate.point]]
t = 50.0
values = { x = 0.2905857243, y = 0.119313817, px = 0.3175956602, py = 0.08024814482 }
rtol = 1e-5
atol = 1e-5
source = "reference"

# The energy is the constant of the motion: 0.5*(px^2 + py^2) + 0.5*(x^2 + y^2) + x^2*y - y^3/3
# stays at its initial 0.1125 for all time. A Modelica expression over the states, evaluated along
# the trajectory; Radau drifts it by about 1e-13 over the run, and 1e-6 is the honest bound.
[[simulate.invariant]]
expr = "0.5 * (px^2 + py^2) + 0.5 * (x^2 + y^2) + x^2*y - y^3 / 3"
value = 0.1125
atol = 1e-6

# The orbit is trapped in the well: it never reaches the escape channels, so the coordinates stay
# well inside the boundary the escape energy would open.
[[simulate.invariant]]
expr = "x"
min = -0.55
max = 0.47

[[simulate.invariant]]
expr = "y"
min = -0.4
max = 0.4
