summary = "The van der Pol oscillator at mu = 1000: a relaxation limit cycle whose step size has to swing over three orders of magnitude."
teaches = ["stiffness from a nonlinearity", "step-size control", "why a fixed step is hopeless"]
requires = []

[parse]
classes = ["VanDerPol"]

[flatten]
model = "VanDerPol"
states = ["x", "y"]
equations = 2
index = 1
balanced = true

# The full limit cycle has period ~ (3 - 2*ln 2)*mu = 1614 s, made of long slow arcs and
# near-vertical jumps. `stop` covers the first slow arc, which is enough to expose bad
# step-size control without making the test a benchmark. Reference values agree to ~1e-6
# across scipy's Radau, BDF and LSODA.
#
# `method` is here and nowhere else, and it is about the integrator rather than the model.
# All three methods walk this problem in the same number of steps -- ~40k for LSODA against
# ~80k for Radau, at the same tolerance -- but scipy's Radau and BDF are written in Python
# and LSODA is compiled Fortran, so the same work costs 22 s or 0.4 s depending only on
# which one is asked. Nothing about the emitted code changes: profiling puts 2 s of a 34 s
# run in the model and the rest in the solver's own linear algebra. So this is a statement
# about scipy, kept next to the model that provoked it.
[simulate]
stop = 50.0
tolerance = 1e-9
method = "LSODA"

[[simulate.point]]
t = 1.0
values = { x = -1.88837065, y = 0.73573753 }
rtol = 1e-4
source = "reference"

[[simulate.point]]
t = 10.0
values = { x = -1.22841942, y = 2.37142118 }
rtol = 1e-4
source = "reference"

[[simulate.point]]
t = 50.0
values = { x = -1.65854995, y = 0.94665684 }
rtol = 1e-4
source = "reference"

# On the slow manifold the trajectory is pinned near |x| = 2; a solver that loses the
# stiff branch runs away immediately.
[[simulate.invariant]]
expr = "x"
min = -2.1
max = 2.1
