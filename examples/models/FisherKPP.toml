# The comparison principle: every point stays between the two equilibria, 0 (empty) and 1
# (invaded), for all time. Checked at the leading, middle and trailing points, with a little slack.
[[simulate.invariant]]
expr = "u[1]"
min = -0.01
max = 1.01

[[simulate.invariant]]
expr = "u[8]"
min = -0.01
max = 1.01

[[simulate.invariant]]
expr = "u[16]"
min = -0.01
max = 1.01

# The front only ever advances: the leading point is never below the trailing one, so u[1] - u[16]
# stays non-negative (zero only at t = 0, when the whole interior is still empty).
[[simulate.invariant]]
expr = "u[1] - u[16]"
min = 0.0
atol = 1e-9

# By t = 6 the front has passed the first point, which is then all but fully invaded.
[[simulate.invariant]]
expr = "u[1]"
min = 0.99
after = 6.0
