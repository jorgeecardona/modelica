summary = "The Fisher-KPP equation, u_t = d * u_xx + r * u * (1 - u): diffusion plus logistic growth, the canonical reaction-diffusion model. Fisher wrote it in 1937 for the spread of an advantageous gene, and Kolmogorov, Petrovsky and Piskunov analysed it the same year; it is the textbook model of a biological invasion, a flame front, or any process where local growth saturates and spreads by diffusion. Discretised by the method of lines on sixteen interior points, the left end is held at the invaded state (u = 1) and the right end empty (u = 0), with the interior starting empty. A front forms at the left and travels right at the asymptotic speed 2 * sqrt(r * d) = 2, connecting the invaded state behind it to the empty state ahead. It is the corpus's third PDE and its first reaction-diffusion one: where TorusHeat is pure diffusion (parabolic) and WaveString a pure wave (hyperbolic), this couples diffusion to a nonlinear local reaction, and the nonlinearity is what makes the front. The comparison principle keeps every u[i] in [0, 1] for all time, and the front only ever advances, both held here as invariants. Sixteen states, so it crosses onto the sparse-Jacobian path with the other two grids -- the reaction adds only a diagonal term, so the pattern stays tridiagonal."
teaches = ["reaction-diffusion: a diffusion term coupled to a nonlinear local reaction, the class behind pattern formation and invasion fronts", "the Fisher-KPP travelling front, invading the empty state at speed 2*sqrt(r*d)", "the method of lines on a reaction-diffusion PDE, with a held (Dirichlet) boundary driving the invasion", "the comparison principle as an invariant: the solution stays between its two equilibria, 0 and 1, for all time"]
requires = []

[parse]
classes = ["FisherKPP"]

[flatten]
model = "FisherKPP"
states = ["u[1]", "u[2]", "u[3]", "u[4]", "u[5]", "u[6]", "u[7]", "u[8]", "u[9]", "u[10]", "u[11]", "u[12]", "u[13]", "u[14]", "u[15]", "u[16]"]
equations = 16
balanced = true

# u_t = d * u_xx + r * u * (1 - u) by the method of lines: each interior point gets the second
# difference a * (u[i-1] - 2 u[i] + u[i+1]), a = d / h^2, plus the reaction r * u[i] * (1 - u[i]).
# The left boundary is held invaded (u[0] = u_left = 1), the right empty (u[n+1] = 0, term drops),
# the interior starts at zero. The front forms at the left and travels right; the solution stays in
# [0, 1]. Sixteen states, so the run takes the sparse path (test_sparsity pins it), same as the
# other two method-of-lines models.
[simulate]
stop = 8.0
tolerance = 1e-10

# One point per second across the run, so the front is pinned all the way from where it forms at
# the left (t = 2, the right end still near zero) to where it reaches the right (t = 7).
[[simulate.point]]
t = 2.0
values = { "u[1]" = 0.8806338431, "u[2]" = 0.751865603, "u[3]" = 0.6127620081, "u[4]" = 0.469966298, "u[5]" = 0.3351549941, "u[6]" = 0.2203448604, "u[7]" = 0.1329680424, "u[8]" = 0.07363003944, "u[9]" = 0.03751723763, "u[10]" = 0.01766968104, "u[11]" = 0.007731394159, "u[12]" = 0.003158417415, "u[13]" = 0.00121002775, "u[14]" = 0.0004362277043, "u[15]" = 0.0001475933928, "u[16]" = 4.375099974e-05 }
rtol = 1e-6
source = "reference"

