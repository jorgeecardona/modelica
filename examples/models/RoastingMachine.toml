summary = "A Loring S15 coffee roaster over one batch: a staged gas schedule, so `time` itself makes events."
teaches = ["time in an equation", "time events", "a staged schedule", "checking a model against a real machine"]
requires = []

[parse]
classes = ["RoastingMachine"]

[flatten]
model = "RoastingMachine"
states = ["T_mach", "T_bean"]
equations = 5
index = 1
balanced = true

# The only example here that is not a physics exercise: this is a real machine, and the
# numbers marked `measured` came off it. Sincerely Coffee's Loring S15, 2026-07-30, five
# batches; this is the first, and the burner schedule in the model is that batch's own
# recorded gas trace, reduced to the nine steps worth carrying.
#
# The model is two nodes:
#
#   C_mach * der(T_mach) = Q_burner - UA*(T_mach - T_bean) - G_loss*(T_mach - T_amb)
#   C_bean * der(T_bean) = UA*(T_mach - T_bean)
#
# `T_mach` is the machine's hot mass -- steel, lining and recirculated air together. It is
# deliberately *not* the machine's inlet probe: a Loring recirculates its exhaust back
# through the burner, and the inlet reads one point on that loop, straight off the flame,
# 60-80 K above the mean the beans actually see. The capture also carries a `return` probe,
# which is the air coming back; neither is a temperature the bean bed is immersed in, and
# no probe on this machine measures one.
#
# `C_bean` is *effective*, and this is the honest gap in the example. Roasting drives about
# a tenth of the charge off as water, and the latent heat of that is a large term in the
# first half. The session recorded no weight in, no weight out and no moisture, so drying
# cannot be separated from the beans' own heat capacity, and it is folded into `C_bean`
# rather than invented as a term with parameters nobody can check. What makes that
# defensible rather than a fudge: fitted freely, `C_bean` lands at 2006 J/(kg K) over a
# 15 kg charge, and dry coffee is about 1800 -- the excess is roughly the drying, sitting
# where it belongs. A `DrainingTank`-style `if` for evaporation was written first and
# thrown away for want of a single weighing.
#
# Parameters were fitted to this batch alone by least squares, then rounded, then checked
# against the other four -- each with its own burner trace, none of them refitted. Worst
# case is batch 5 at 3.1 C rms; the drop temperature comes out 0.5 to 6.8 C high across
# the set. For a two-state lump against a real roaster that is close enough to be worth
# writing down and far enough to be worth admitting.
[simulate]
stop = 863.0
tolerance = 1e-11

# What the roaster's own probe read, at the same instants. `atol` is the model's honest
# agreement with the machine, not a solver tolerance -- over the 502 samples from t = 90 s
# to the drop it holds 1.01 C rms and never exceeds 3.24 C.
#
# Nothing is asserted before 90 s. The probe sits in the bean mass and at charge it is
# still leaving the empty drum it was reading at 216 C, so the measurement collapses to a
# turning point near 62 C over the first 45 seconds -- an instrument in transit, not a
# temperature the beans ever had. The model starts the beans at ambient and integrates
# from there, which is right about the beans and says nothing about the probe.
[[simulate.point]]
t = 120.0
values = { bean = 94.61 }
atol = 3.0
source = "measured"

[[simulate.point]]
t = 240.0
values = { bean = 135.28 }
atol = 3.0
source = "measured"

[[simulate.point]]
t = 360.0
values = { bean = 158.28 }
atol = 3.0
source = "measured"

[[simulate.point]]
t = 480.0
values = { bean = 176.61 }
atol = 3.0
source = "measured"

[[simulate.point]]
t = 600.0
values = { bean = 192.33 }
atol = 3.0
source = "measured"

[[simulate.point]]
t = 720.0
values = { bean = 208.94 }
atol = 3.0
source = "measured"

# The drop. 14.4 minutes, and the roaster pulled the batch at 216.1 C.
[[simulate.point]]
t = 863.0
values = { bean = 216.06 }
atol = 3.0
source = "measured"

# The same instants again, against scipy at rtol=atol=1e-12 rather than against the
# machine. The measured points above cannot catch a toolchain regression -- three degrees
# of slack hides a great deal -- so these carry the precision and those carry the reality.
[[simulate.point]]
t = 240.0
values = { "T_mach" = 440.182755652, "T_bean" = 407.425547710 }
rtol = 1e-8
source = "reference"

[[simulate.point]]
t = 600.0
values = { "T_mach" = 483.410036264, "T_bean" = 466.595809254 }
rtol = 1e-8
source = "reference"

[[simulate.point]]
t = 863.0
values = { "T_mach" = 494.126226705, "T_bean" = 489.647402516 }
rtol = 1e-8
source = "reference"

# Eight steps in the gas, eight time events. No state crosses anything here: the only
# thing that moves the burner is the clock, which is what this example is in the corpus
# to exercise.
[simulate.events]
times = [66.7, 93.0, 526.9, 618.0, 688.5, 714.6, 754.4, 780.8]
atol = 1e-9

# Heat runs machine to beans for the whole batch and never turns around -- the beans
# approach the machine but do not catch it, closing to 4.5 K by the drop.
[[simulate.invariant]]
expr = "T_mach - T_bean"
min = 0.0
max = 132.0

# The beans start at ambient and end at the drop. Nothing overshoots.
[[simulate.invariant]]
expr = "bean"
min = 20.0
max = 217.0

# The burner only ever sits on one of the schedule's levels, between the idle it charges
# on and the 85 % it climbs at.
[[simulate.invariant]]
expr = "burner"
min = 20.0
max = 85.0
