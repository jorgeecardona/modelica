summary = "A Loring S15 coffee roaster over one batch: gas on a clock, water on a threshold, and a probe that lags both."
teaches = [
  "time in an equation",
  "time events beside a state event",
  "a parameter computed from other parameters",
  "modelling the sensor, not just the thing measured",
  "checking a model against a real machine",
]
requires = []

[parse]
classes = ["RoastingMachine"]

[flatten]
model = "RoastingMachine"
states = ["T_mach", "T_bean", "T_probe", "m_w"]
equations = 12
index = 1
balanced = true

# The only example here that is not a physics exercise: this is a real machine, and the
# numbers marked `measured` came off it. Sincerely Coffee's Loring S15, 2026-07-30, five
# batches; this is the first, and the burner schedule is that batch's own recorded gas
# trace, reduced to the nine steps worth carrying.
#
# Four states, and each is a different kind of thing:
#
#   T_mach   the machine's hot mass -- steel, lining and recirculated air together
#   T_bean   the coffee
#   T_probe  the thermocouple in the coffee, which is not the same as the coffee
#   m_w      the water still in the beans
#
# `T_mach` is deliberately *not* the machine's inlet probe. A Loring recirculates its
# exhaust back through the burner, and the inlet reads one point on that loop, straight off
# the flame. Nor is it what the bean probe reads in an empty drum: that thermocouple is
# measuring moving air, which is why it can fall from 256 to 207 degC in 76 seconds -- no
# mass of 5.2e5 J/K does that.
#
# `T_probe` is the point of the third state, and it is why this spec can check the roast
# from t = 0 rather than starting 90 seconds in. At charge the probe is not at bean
# temperature: it has been hanging in that recirculating air at 217 degC, and then thirteen
# and a half kilos of 20 degC coffee bury it. What the log shows over the next forty-odd
# seconds is a thermocouple travelling, and modelling it costs one state and one time
# constant. The *turning point* -- the minimum every roaster watches for -- is then
# something the model produces rather than something excluded.
#
# The lag is not small and it does not vanish. Around two minutes the coffee is running 8 K
# ahead of the number the roaster is reading, closing to under a degree by the drop. Anyone
# steering by bean temperature is steering by a quantity that is late.
[simulate]
stop = 863.0
tolerance = 1e-11

# --------------------------------------------------------------------------------------
# What the roaster's own probe read, at those instants.
#
# `atol` is the model's honest agreement with the machine, not a solver tolerance. Over all
# 558 samples of the batch it holds 1.67 K rms; from 120 s to the drop, 1.24 K rms and never
# worse than 2.9 K.
# --------------------------------------------------------------------------------------

# The turning point, which the model has to get right rather than skip.
[[simulate.point]]
t = 45.0
values = { probe = 64.50 }
atol = 3.0
source = "measured"

[[simulate.point]]
t = 120.0
values = { probe = 94.61 }
atol = 3.0
source = "measured"

[[simulate.point]]
t = 300.0
values = { probe = 147.61 }
atol = 3.0
source = "measured"

[[simulate.point]]
t = 600.0
values = { probe = 192.33 }
atol = 3.0
source = "measured"

# The drop. 14.4 minutes, and the roaster pulled the batch at 216.1 degC.
[[simulate.point]]
t = 863.0
values = { probe = 216.06 }
atol = 3.0
source = "measured"

# The batch was also weighed, which is the only reason the drying below is worth anything.
# 13.8 kg in, 11.73-11.76 kg out over the four weighed batches: 14.78 to 15.00 % lost.
# Roasting drives off dry matter as well as water -- CO2, volatiles, chaff, three or four
# points of it -- and this model has no term for that, so what it must reproduce is the
# water alone. 11.37 % is the measured total less an assumed 3.5 % organic loss, and that
# 3.5 % is the softest number on this page.
[[simulate.point]]
t = 863.0
values = { loss = 11.37 }
atol = 0.5
source = "measured"

# --------------------------------------------------------------------------------------
# The same instants against scipy at rtol=atol=1e-12 rather than against the machine.
# Measured points cannot catch a toolchain regression -- three degrees of slack hides a
# great deal -- so these carry the precision and those carry the reality.
# --------------------------------------------------------------------------------------

[[simulate.point]]
t = 120.0
values = { "T_mach" = 497.843990816, "T_bean" = 376.482274438, "T_probe" = 367.954896103, "m_w" = 1.668878566 }
rtol = 1e-8
source = "reference"

[[simulate.point]]
t = 300.0
values = { "T_mach" = 504.376598656, "T_bean" = 425.615863674, "T_probe" = 422.088239040, "m_w" = 1.197078860 }
rtol = 1e-8
source = "reference"

[[simulate.point]]
t = 863.0
values = { "T_mach" = 502.072738773, "T_bean" = 488.061924124, "T_probe" = 487.707134726, "m_w" = 0.216640919 }
rtol = 1e-8
source = "reference"

# Eight steps in the gas and one crossing of the drying onset. The eight are known before
# the run starts -- the condition is on `time` -- and the ninth is not: it is where the
# beans reach 40 degC and the water starts leaving, which depends on the trajectory. Having
# both kinds in one model is the reason this example is in the corpus.
[simulate.events]
times = [20.241885, 66.7, 93.0, 526.9, 618.0, 688.5, 714.6, 754.4, 780.8]
atol = 1e-6

# Heat runs machine to beans for the whole batch and never turns around.
[[simulate.invariant]]
expr = "T_mach - T_bean"
min = 0.0
max = 218.0

# Water only ever leaves. It starts at m_green*moisture = 13.8*0.13, which is 1.794 the way
# people write it and 1.7940000000000003 the way binary floats hold it -- hence the `atol`,
# which is the product's last bit and not a statement about water.
[[simulate.invariant]]
expr = "m_w"
min = 0.21
max = 1.794
atol = 1e-9

[[simulate.invariant]]
expr = "evap"
min = 0.0
max = 0.003

# The probe starts hot, dives to the turning point, and climbs to the drop. It never gets
# above where it started, because nothing in the batch is as hot as the empty drum was.
#
# `atol` here is arithmetic, not physics. The ceiling is the probe's own start value, which
# the model reaches by computing `T_probe - 273.15` from a `start` of 489.98 -- and that
# subtraction lands four parts in 1e14 above the literal. Asking for the exact number is
# asking the floats for a cancellation they do not have.
[[simulate.invariant]]
expr = "probe"
min = 60.0
max = 216.83
atol = 1e-9

# The coffee starts at ambient and ends at the drop.
[[simulate.invariant]]
expr = "bean"
min = 20.0
max = 215.0

# The burner only ever sits on one of the schedule's levels.
[[simulate.invariant]]
expr = "burner"
min = 20.0
max = 85.0

# --------------------------------------------------------------------------------------
# THE DRYING ONSET IS NOT 100 degC, AND THAT MATTERS.
#
# An earlier version of this model gated evaporation at boiling, on the reasoning that
# water leaves when water boils. Once the batch was weighed, that model could not be made
# to work: forced to remove the mass actually measured, the curve came apart, and left
# alone it removed less than a quarter of the water. Sweeping the onset downward improves
# the fit and the mass balance together, monotonically, all the way to ambient --
#
#     onset   moisture   curve rms   water lost   dried by half-time
#      100C     14.5%      1.806K       11.24%          38.7%
#       60C     13.5%      1.492K       11.27%          51.9%
#       40C     13.0%      1.373K       11.37%          58.1%
#       20C     12.5%      1.232K       11.41%          64.3%
#
# -- which says the truth has no threshold and that this linear law stands in for something
# smoother. A coffee bean is porous and gives up bound water by diffusion the whole time it
# is warm, which is why roasters call the *first* third of a roast the drying phase; only a
# puddle waits for 100 degC.
#
# `T_dry = 40 degC` is therefore a modelling choice and not a measurement. It costs 0.14 K
# of fit against no threshold at all, and it buys a crossing that is a real event rather
# than one firing at t = 0 and meaning nothing.
#
# Worth recording how this was nearly missed. Holding the seven machine parameters fixed and
# sweeping only the drying, no combination reproduces both the curve and the mass -- the
# obvious reading being that a term is missing, and first crack being genuinely exothermic
# makes that a tempting one. But those seven had been fitted against a model whose latent
# sink was four times too small, so `UA`, `G_loss` and `Q_max` had already absorbed the
# missing heat; adding it back on top of them has to fail. Refitting everything together is
# what showed the shape was fine all along.
#
# MOISTURE REMAINS A PARAMETER. Nobody measured the water content of that coffee -- the
# weighing gives total loss, not what fraction of the green was water -- so `moisture = 0.13`
# is a value consistent with the mass balance rather than a reading. A green moisture meter
# would turn the softest two numbers on this page, `moisture` and the 3.5 % organic loss,
# into one measurement and one residual.
#
# What that measurement would buy, measured 2026-08-09 by sweeping `moisture` from 10 to 16 %
# and simulating each with the other seven parameters left where the joint fit put them:
#
#     water lost (% of charge) = 0.821 * green moisture (%) + 0.739
#
# straight to within 0.028 points over that range. So one point of green moisture is 0.82
# points of charge, and the organic residual -- measured total loss less this -- moves 0.82
# points the other way. The slope is under 1.00 because the water is also a heat sink: more of
# it means cooler beans and a smaller fraction driven off, 88.8 % at 11 % against 87.0 % at
# 15 %. At the 13 % carried here the residual is 3.35 to 3.57 %, which brackets the assumed
# 3.5 % and is worth nothing: the 11.37 % target below was derived by subtracting that 3.5 %.
#
# The curve is not indifferent either -- the probe rms over the five measured points has a
# minimum near 13.1 % and costs 4.2 K by 10 % -- and that is not a determination. Those seven
# parameters were fitted jointly with `moisture = 0.13`, so freezing them and sweeping the
# eighth asks where the eighth belongs given seven chosen to suit it. Same trap as the
# exotherm.
#
# THE PARAMETERS ARE THE SESSION'S, NOT BATCH 1'S. Fitted against all five batches at once,
# with one initial machine temperature each, because that is what genuinely differed: batch
# 1 followed a 35-minute cold-start preheat, batches 2-5 came off a purge-and-reheat between
# roasts. Carried over unchanged the other four hold 1.23 to 1.39 K rms whole-curve, 0.96 to
# 1.20 K after 120 s -- better than batch 1, which is the one the example carries because it
# is the only one whose probe was not still swinging from the previous drop at the charge
# mark.
# --------------------------------------------------------------------------------------
