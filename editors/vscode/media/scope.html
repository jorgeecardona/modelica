<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-__NONCE__';">
<title>Simulation Scope</title>
<style>
  :root {
    /* Match the editor: VS Code injects its active theme as --vscode-* variables and updates
       them live when the theme changes, so the scope follows dark/light/high-contrast exactly.
       The fallbacks are a light palette for outside VS Code (the browser preview). */
    color-scheme: light dark;
    --ink: var(--vscode-editor-foreground, #1a1a1a);
    --dim: var(--vscode-descriptionForeground, #6b6b6b);
    --line: var(--vscode-panel-border, var(--vscode-widget-border, #d9d9d9));
    --bg: var(--vscode-editor-background, #ffffff);
    --panel: var(--vscode-editorWidget-background, #f4f5f7);
    --panel-2: var(--vscode-editorWidget-background, #eceef1);
    --accent: var(--vscode-textLink-foreground, #3a6ea5);
    --accent-ink: var(--vscode-button-foreground, #ffffff);
    --rail: var(--vscode-sideBar-background, var(--vscode-editorWidget-background, #f7f8fa));
    --legend-w: 208px; /* the legend column; the splitter changes it, double-click collapses */
  }
  * { box-sizing: border-box; }
  /* A `hidden` element stays hidden even when a class gives it a `display` (the live-only stop
     control is `.stopwrap`, whose `inline-flex` would otherwise defeat the attribute). */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.45 var(--vscode-font-family, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
    display: flex; flex-direction: column;
  }
  .top {
    display: flex; align-items: baseline; gap: 4px 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap;
  }
  .top h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .2px; white-space: nowrap; }
  .top .sub { color: var(--dim); font-size: 12px; min-width: 0; flex: 1 1 140px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .count { margin-left: auto; color: var(--dim); font-size: 12px;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .top .ver { color: var(--dim); font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }
  .app { flex: 1; display: grid; grid-template-columns: 232px 1fr 6px var(--legend-w); min-height: 0; }
  /* one open .mo: no rail, chart takes its place */
  body.single .app { grid-template-columns: 1fr 6px var(--legend-w); }
  body.single .rail { display: none; }
  /* -- model rail -- */
  .rail { border-right: 1px solid var(--line); background: var(--rail);
    overflow-y: auto; padding: 6px 0; }
  .grp { padding: 12px 14px 4px; font-size: 10.5px; font-weight: 650; letter-spacing: .7px;
    text-transform: uppercase; color: var(--dim); }
  .item { display: flex; align-items: baseline; gap: 8px; padding: 5px 14px; cursor: pointer;
    border-left: 2px solid transparent; }
  .item:hover { background: var(--panel); }
  .item.on { background: var(--panel); border-left-color: var(--accent); }
  .item .nm { font-weight: 550; }
  .item .mt { margin-left: auto; color: var(--dim); font-size: 11px;
    font-variant-numeric: tabular-nums; }
  .item.on .nm { color: var(--accent); }
  /* -- scope -- */
  .scope { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .mhead { padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
  .mrow { display: flex; align-items: baseline; gap: 8px 12px; flex-wrap: wrap; }
  .mrow .name { min-width: 0; }
  .mhead .name { font-size: 17px; font-weight: 650; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  /* Two lines then ellipsis: a corpus summary is a sentence, a live .mo's is its path -- both
     stay compact instead of pushing the chart down. The full text is on the title attribute. */
  .mhead .desc { color: var(--dim); margin-top: 3px; max-width: 72ch;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .chip { font-size: 11px; color: var(--dim); background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 1px 9px; font-variant-numeric: tabular-nums; }
  .chip.tag { background: transparent; }
  .tools { margin-left: auto; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  /* The time controls, together: the stop field, then the two automatic stops. */
  .stopwrap { color: var(--dim); display: inline-flex; align-items: baseline; gap: 5px; font-size: 12px; }
  .stopwrap label { display: inline-flex; align-items: baseline; gap: 3px; }
  .stopwrap input { width: 88px; font: inherit; font-size: 12px; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px;
    -moz-appearance: textfield; }
  /* Drop the number spinner: its arrows overlapped the value in a narrow field, so a stop time
     of a few hundred seconds could not be read. The value is set by typing, the marker, or a
     preset, none of which need the arrows. */
  .stopwrap input::-webkit-inner-spin-button,
  .stopwrap input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .stopwrap .unitlab { color: var(--dim); }
  .plotwrap { flex: 1; min-height: 0; display: flex; }
  svg { flex: 1; min-width: 0; display: block; touch-action: none; }
  select, button {
    font: inherit; font-size: 12px; color: inherit; background: var(--panel);
    border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; cursor: pointer;
    white-space: nowrap;  /* a label like "+ compare" keeps its width; the row wraps, not the text */
  }
  button:hover, select:hover { border-color: var(--dim); }
  button:focus-visible, select:focus-visible, .item:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px; }
  .foot { flex: none; height: 26px; padding: 5px 16px; border-top: 1px solid var(--line);
    color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden;
    font-variant-numeric: tabular-nums; }
  /* -- legend -- */
  .legend { border-left: 1px solid var(--line); overflow-y: auto; padding: 8px 0; }
  /* The splitter between chart and legend: a 6px grip column, its line shown on hover. */
  .split { cursor: col-resize; position: relative; }
  /* The legend toggle exists for the narrow pane only; wide, the legend is always there. */
  #legendbtn { display: none; }
  #legendbtn[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .split::after { content: ""; position: absolute; inset: 0 2px; background: var(--accent);
    opacity: 0; transition: opacity .12s; }
  .split:hover::after, .split.on::after { opacity: .6; }
  body.legend-collapsed .legend { display: none; }
  /* The events, below the variables: time, then the relation that fired. */
  #evtitle { margin-top: 12px; }
  .evrow { display: flex; align-items: baseline; gap: 8px; padding: 2px 12px; cursor: pointer;
    white-space: nowrap; font-size: 12px; }
  .evrow:hover { background: var(--panel); }
  .evrow .evt { font-variant-numeric: tabular-nums; min-width: 5.5ch; text-align: right; }
  .evrow .evc { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  /* The stop marker: where the run ends, as a handle you drag to move the horizon. */
  .stopline { stroke: var(--accent); stroke-dasharray: 3 3; opacity: .9; }
  .stopgrip { fill: var(--accent); cursor: ew-resize; }
  .stoplab { fill: var(--accent); font-size: 10px; font-weight: 600; }
  .event.pin { opacity: .3; }
  /* Measurement marks and their readout: a thin line per mark, and a small panel with the
     interval and each variable's change when there are two. */
  .mark { stroke: var(--ink); stroke-width: 1; opacity: .7; }
  .marklab { fill: var(--ink); font-size: 10px; font-weight: 650; }
  .measurebg { fill: var(--panel); stroke: var(--line); opacity: .94; }
  .measure { fill: var(--ink); font-size: 11px; font-variant-numeric: tabular-nums; }
  .measure.dim { fill: var(--dim); }
  /* Runs: the live one and any pinned for comparison, as chips (A, B, ...). Pinned draw dashed. */
  .runs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; align-items: center; }
  .run { display: inline-flex; align-items: baseline; gap: 6px; font-size: 11px; padding: 1px 8px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--dim);
    font-variant-numeric: tabular-nums; }
  .run.live { color: var(--ink); border-color: var(--accent); }
  .run .tag { font-weight: 650; }
  .run .dash { width: 18px; height: 0; border-top: 2px solid var(--ink); align-self: center; }
  .run .x { cursor: pointer; padding-left: 2px; }
  .run .x:hover { color: var(--accent); }
  /* Parameters, editable in the legend: an overridden one is outlined and gets an undo; a
     derived one (m_dry from m_green) is dimmed and read-only, recomputed by the simulator. */
  #ptitle { margin-top: 12px; }
  /* One grid for every row -- name | value | unit | undo -- so the values line up in a column
     whatever the name's length, the units line up beside them, and an undo appearing on one
     row does not shift the others. The value column is wide enough for 2260000 and 0.0000202. */
  .prow { display: grid; grid-template-columns: minmax(56px, 1fr) minmax(72px, 96px) 5ch 1.2em;
    align-items: baseline; column-gap: 7px; padding: 2px 12px; font-size: 12px; white-space: nowrap; }
  .prow .pn { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* In a narrow legend (the 208px default) four columns would squeeze the name to a letter, so
     the row goes to two lines: the name on its own, the value, unit and undo right-aligned
     beneath it. Drag the legend wider than 250px and the one-line aligned grid comes back. */
  .legend { container-type: inline-size; }
  @container (max-width: 250px) {
    .prow { grid-template-columns: 1fr 96px 7.5ch 1.2em; row-gap: 1px; padding-top: 4px; }
    .prow .pn { grid-column: 1 / -1; }
    .prow input, .prow .pv { grid-column: 2; }
    .prow .pu { grid-column: 3; }
    .prow .undo { grid-column: 4; }
  }
  .prow input, .prow .pv { width: 100%; box-sizing: border-box; font: inherit; font-size: 11.5px;
    text-align: right; font-variant-numeric: tabular-nums; }
  .prow input { color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px; }
  .prow input.set { border-color: var(--accent); }
  .prow .pv { padding: 1px 5px; }
  .prow .pu { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
  .prow.derived { color: var(--dim); }
  .prow .undo { cursor: pointer; color: var(--dim); text-align: center; }
  .prow .undo:hover { color: var(--accent); }
  /* The sweep: one parameter over a range, one pinned run per value, and a small chart of a
     response read off each run against the parameter -- drop time against charge. */
  #stitle { margin-top: 12px; }
  .sweepctl { padding: 0 12px 4px; font-size: 12px; }
  .srow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px; margin: 3px 0; }
  .srow .l { color: var(--dim); }
  .srow input { width: 58px; font: inherit; font-size: 11.5px; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; text-align: right;
    font-variant-numeric: tabular-nums; }
  .srow input#ssteps { width: 34px; }
  .srow select { max-width: 100%; }
  .schart { display: block; width: 100%; height: 130px; margin-top: 4px; }
  .schart .rp { fill: var(--accent); }
  .schart .rl { stroke: var(--accent); fill: none; stroke-width: 1.4; }
  .schart .rtick { fill: var(--dim); font-size: 9.5px; font-variant-numeric: tabular-nums; }
  .schart .rax { stroke: var(--line); }
  /* A measured log: its samples as hollow points in the variable's colour, so the simulation's
     line can be judged against what the machine actually read; a row per log in the legend
     with the columns it matched, the ones it did not, its time unit, and a way to drop it. */
  .logpt { fill: var(--bg); stroke-width: 1.3; }
  #ltitle { margin-top: 12px; }
  .lrow { padding: 3px 12px; font-size: 12px; }
  .lrow .lhead { display: flex; align-items: baseline; gap: 6px; }
  .lrow .lname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .lrow .x { cursor: pointer; color: var(--dim); }
  .lrow .x:hover { color: var(--accent); }
  .lrow .lcols { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 2px; font-size: 11px; }
  .lcol { font-variant-numeric: tabular-nums; }
  .lcol.miss { color: var(--dim); text-decoration: line-through; }
  /* The sensitivity tornado: one row per parameter, a bar from the response at -step to the
     response at +step around the base, widest first -- which knob moves the drop time most. */
  #ntitle { margin-top: 12px; }
  .tchart { display: block; width: 100%; margin-top: 4px; }
  .tchart .tbar { fill: var(--accent); opacity: .55; }
  .tchart .tbase { stroke: var(--ink); stroke-width: 1; }
  .tchart .tname { fill: var(--ink); font-size: 11px; }
  .tchart .tval { fill: var(--dim); font-size: 9.5px; font-variant-numeric: tabular-nums; }
  .tchart .tmiss { fill: var(--dim); font-size: 9.5px; font-style: italic; }
  .legtitle { padding: 4px 12px 6px; font-size: 10.5px; font-weight: 650; letter-spacing: .7px;
    text-transform: uppercase; color: var(--dim); }
  .row { display: flex; align-items: baseline; gap: 7px; padding: 2px 12px; cursor: pointer;
    white-space: nowrap; }
  .row:hover { background: var(--panel); }
  .row.off { opacity: .38; }
  .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; align-self: center; }
  .row .name { overflow: hidden; text-overflow: ellipsis; }
  .row .value { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--dim);
    font-size: 12px; }
  .axis { stroke: var(--line); }
  .tick { fill: var(--dim); font-size: 10px; }
  .grid { stroke: var(--line); stroke-dasharray: 2 3; opacity: .65; }
  .event { stroke: var(--dim); stroke-dasharray: 4 3; opacity: .8; }
  .cursor { stroke: var(--dim); }
  .band { fill: var(--accent); opacity: .16; }
  .refring { fill: none; stroke-width: 1.5; }
  .note { padding: 5px 16px; color: var(--dim); font-size: 11px; border-top: 1px solid var(--line);
    flex: none; }
  @media (max-width: 780px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    /* single model has no rail, so the chart owns the whole height */
    body.single .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr); }
    .rail { display: flex; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line);
      max-height: 132px; }
    .legend, .split { display: none; }
    /* Narrow, the legend is off by default -- the chart needs the width -- but everything in it
       (parameters, the sweep, sensitivity) must stay reachable: the `legend` button in the
       toolbar opens it as a strip under the chart, capped so the chart keeps most of the height. */
    #legendbtn { display: inline-block; }
    body.legend-open .legend { display: block; border-left: 0; border-top: 1px solid var(--line); }
    /* The legend's row is capped by the grid, not by the legend: an `auto` row sized to the
       legend's content squeezed the chart to a sliver (15px at 720px tall, measured), while a
       `minmax(0, 30vh)` row keeps the chart at two thirds of the height and scrolls the legend. */
    body.legend-open .app { grid-template-rows: auto minmax(0, 1fr) minmax(0, 30vh); }
    body.single.legend-open .app { grid-template-rows: minmax(0, 1fr) minmax(0, 30vh); }
  }
  /* Narrow pane (the .mo open beside its editor -- often ~300px). The toolbar takes the full
     width and lays out in tidy rows: the time controls together, the two selects together, then
     the action buttons. Each control keeps its natural width (labels never wrap, `nowrap`
     above) and the row wraps when it runs out of room, so nothing is crushed or clipped. */
  @media (max-width: 560px) {
    .top { padding: 8px 12px; }
    .mhead { padding: 10px 12px 8px; }
    .mhead .name { font-size: 15px; }
    .tools { width: 100%; margin-left: 0; margin-top: 4px; gap: 6px; }
    .stopwrap { flex: 1 1 100%; flex-wrap: wrap; }
    .stopwrap label { flex: 1 1 120px; }
    .stopwrap input { flex: 1 1 auto; width: auto; min-width: 78px; }
    .stopwrap button { flex: 1 1 auto; }
    #scale { flex: 1 1 100%; }
    #timeunit, #disp { flex: 1 1 46%; }
    #pin, #all, #none, #reset, #legendbtn { flex: 1 1 auto; }
    .foot, .note, .srcnote { padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>
<body>
<div class="top">
  <h1>Simulation Scope</h1>
  <span class="sub">the pymodelica corpus, integrated to its reference points</span>
  <span class="count" id="count"></span>
  <span class="ver" title="the extension build that drew this panel; after upgrading, reload the window if this is old">v__VERSION__</span>
  <span class="ver" id="solver" title="the integrator this run used: the model's own [simulate] method and tolerance from its .toml, else Radau at 1e-6"></span>
</div>

<div class="app">
  <nav class="rail" id="rail" aria-label="models"></nav>
  <section class="scope">
    <div class="mhead">
      <div class="mrow">
        <span class="name" id="mname"></span>
        <span class="tools">
          <span id="stopwrap" class="stopwrap" hidden>
            <label title="simulation stop time -- Enter to re-run, or drag the marker on the plot">t&nbsp;&#8594;&nbsp;<input id="stop" type="number" step="any" min="0"><span class="unitlab" id="stopunit"></span></label>
            <button type="button" id="nextev" title="continue until the next event (bounded by the pymodelica.autoStopMax setting)">&#8594; event</button>
            <button type="button" id="settle" title="stop where the signals settle: every state within 1% of its final value (bounded by pymodelica.autoStopMax)">&#8677; settle</button>
            <select id="speed" title="how hard the integrator works: fast for looking, exact to reproduce the model's reference run. A chaotic model draws a different path at each -- the trajectory only means one thing at the tolerance its references were taken at.">
              <option value="1e-6">fast</option>
              <option value="1e-8">fine</option>
              <option value="">exact</option>
            </select>
            <label title="the largest gap between drawn points, in the shown time unit: the resolution of the line. Empty lets the panel choose. Smaller is denser and heavier.">&#916;t&nbsp;&#8804;&nbsp;<input id="maxdt" type="number" step="any" min="0" placeholder="auto"></label>
          </span>
          <select id="scale" title="vertical axis">
            <option value="linear">linear</option>
            <option value="log">log |y|</option>
            <option value="norm">normalised</option>
            <option value="units">by unit</option>
            <option value="split">split (per-variable)</option>
          </select>
          <select id="xaxis" title="what the x axis is: time, or a variable -- a phase plot, RoR against bean temperature or Lorenz's x against z"><option value="">x: time</option></select>
          <select id="timeunit" title="time axis unit: the data stays in seconds, only what is shown converts">
            <option value="s">seconds</option>
            <option value="min">minutes</option>
          </select>
          <select id="disp" title="display units: the data stays SI, only what is printed converts">
            <option value="si">SI units</option>
            <option value="c">K as &deg;C</option>
          </select>
          <button type="button" id="pin" title="pin this run to compare against: it keeps drawing, dashed, while you change parameters" hidden>+ compare</button>
          <button type="button" id="logbtn" title="overlay a measured log: a CSV with a time column and one column per variable, named as in the model" hidden>log…</button>
          <button id="all">all</button>
          <button id="none">none</button>
          <button id="reset" title="or double-click the chart">reset</button>
          <button type="button" id="legendbtn" aria-pressed="false" title="show or hide the legend -- variables, events, parameters, sweep, sensitivity -- which a narrow pane hides by default">legend</button>
        </span>
      </div>
      <div class="desc" id="mdesc"></div>
      <div class="chips" id="mchips"></div>
      <div class="runs" id="runs" hidden></div>
    </div>
    <div class="plotwrap"><svg id="chart"><g id="plot"></g><g id="hud"></g></svg></div>
    <div class="foot" id="foot">drag to zoom · click to mark, twice for Δ · double-click to reset</div>
  </section>
  <div class="split" id="split" title="drag to resize · double-click to collapse"></div>
  <aside class="legend">
    <div class="legtitle">variables</div><div id="legend"></div>
    <div class="legtitle" id="evtitle" hidden>events</div><div id="evlist"></div>
    <div class="legtitle" id="ptitle" hidden>parameters</div><div id="plist"></div>
    <div class="legtitle" id="stitle" hidden>sweep</div>
    <div id="sweepctl" class="sweepctl" hidden>
      <div class="srow"><select id="sparam" title="the parameter to sweep"></select></div>
      <div class="srow"><span class="l">from</span><input id="sfrom" type="text" inputmode="decimal" spellcheck="false" autocomplete="off"><span class="l">to</span><input id="sto" type="text" inputmode="decimal" spellcheck="false" autocomplete="off"><span class="l">in</span><input id="ssteps" type="text" inputmode="numeric" spellcheck="false" autocomplete="off" value="5"><span class="l">runs</span></div>
      <div class="srow"><button type="button" id="srun" title="simulate the model once per value, each as a pinned run">run sweep</button><button type="button" id="sclear" title="drop the sweep's runs">clear</button></div>
      <div class="srow"><span class="l">response</span><select id="sresp" title="the number read off each run and plotted against the parameter"></select></div>
      <svg id="schart" class="schart"></svg>
    </div>
    <div class="legtitle" id="ltitle" hidden>measured</div>
    <div id="loglist"></div>
    <div class="legtitle" id="ntitle" hidden>sensitivity</div>
    <div id="sensctl" class="sweepctl" hidden>
      <div class="srow"><span class="l">of</span><select id="nresp" title="the response: a variable's final value, or the time an event first fires"></select></div>
      <div class="srow"><span class="l">to each parameter, &plusmn;</span><input id="nstep" type="text" inputmode="decimal" spellcheck="false" autocomplete="off" value="5"><span class="l">%</span><button type="button" id="nrun" title="run every editable parameter a step either way (two simulations each) and read the response off each">compute</button></div>
      <svg id="tchart" class="tchart"></svg>
    </div>
  </aside>
</div>
<div class="note" id="srcnote"></div>

<script id="data" type="application/json" nonce="__NONCE__">__DATA__</script>
<script nonce="__NONCE__">
"use strict";
const DB = JSON.parse(document.getElementById("data").textContent);
const LIVE = __LIVE__;
const vscodeApi = (typeof acquireVsCodeApi === "function") ? acquireVsCodeApi() : null;
let MODELS = DB.models;
const PALETTE = ["#4c78a8","#f58518","#54a24b","#e45756","#72b7b2","#eeca3b",
                 "#b279a2","#ff9da6","#9d755d","#bab0ac"];
const M = {l: 60, r: 12, t: 10, b: 24};

const svg = document.getElementById("chart");
const plot = document.getElementById("plot");
const hud = document.getElementById("hud");
const legend = document.getElementById("legend");
const foot = document.getElementById("foot");

let D = null;            // active model
let names = [];          // series names
let T = [];              // time
let N = 0;
let on = new Set();
let scale = "linear";
let win = [0, 1];
let drag = null;
let stopDrag = false;    // dragging the stop marker, as opposed to a zoom band
let box = {w: 0, h: 0};
let cssbg = "#ffffff";
// Runs: the last is the live one (solid, editable); earlier ones are pinned comparisons, each
// interpolated onto the live run's time grid so every drawing loop shares one x.
let RUNS = [];           // [{overrides, data, onBase}]
let overrides = {};      // the live run's parameter overrides, name -> SI value
let dispMode = "si";     // display units: "si", or "c" to print kelvin as celsius
let timeMode = "s";      // time axis: "s" seconds, or "min" minutes -- the data stays in seconds
// The largest gap between drawn points, in seconds, or null to let the panel choose the
// density. A cap on Δt is a resolution the user sets outright: the run outputs a grid at this
// spacing and the sampler keeps it, so the line is this dense everywhere, however far it is
// zoomed. Smaller is denser and a bigger payload.
let maxDt = null;
// How hard the integrator works: the relative tolerance the panel asks for. "" means the
// model's own reference tolerance (its .toml), which reproduces its reference points and, on a
// stiff or chaotic model, is several times slower than looking at a trajectory needs. The
// double pendulum's .toml asks for 1e-10 (~2.5 s); at the fast default it draws in a quarter
// second. A change of speed is a fresh run, never a continuation.
let speed = "1e-6";
// The x axis. null is time; a variable name makes a phase plot, every selected variable drawn
// against that one at the same instants (RoR against bean temperature, Lorenz x against z).
// `xwin` is a zoom in that variable's units, `XD` the domain X() maps from, set once per draw.
let xVar = null;
let xwin = null;
// Time on a log axis ("x: log time"): a stiff model over a long horizon -- E5 runs to 1e13 s
// and finishes its kinetics by 1e3 -- has all its motion in the first decades, which a linear
// axis puts in one pixel column. Only the mapping changes; the data, the window and the
// cursor stay in seconds. TFLOOR is the smallest positive instant, standing in for t = 0.
let LOGT = false;
let TFLOOR = 1e-12;
let XD = [0, 1];
// Measurement marks: up to two sample indices set by clicking. One is a readout; two give the
// interval between them and every selected variable's change across it -- the drying phase's
// length, turning point to first crack -- the way an oscilloscope's cursors do.
let marks = [];
// Measured logs overlaid on the plot: {name, t (seconds), series {column: values}, tscale}.
// `tscale` is what the file's clock is multiplied by to get seconds (60 for a log in minutes).
let LOGS = [];
let lastModel = null;    // to keep the view across a re-run of the same model
let prevEnd = 0;

function readBg() {
  cssbg = getComputedStyle(document.body).backgroundColor || "#ffffff";
}

// -- rail ------------------------------------------------------------------------------
function buildRail() {
  const rail = document.getElementById("rail");
  // One model means one open .mo, not the corpus: drop the rail (via a class the responsive
  // rules respect) and give the chart its room.
  if (MODELS.length <= 1) {
    document.body.classList.add("single");
    document.querySelector(".top .sub").textContent =
      MODELS.length ? MODELS[0].summary : "";
    document.getElementById("count").textContent =
      MODELS.length ? MODELS[0].events.length + " events" : "";
    return;
  }
  const groups = {};
  MODELS.forEach((m, i) => { (groups[m.group] = groups[m.group] || []).push(i); });
  // The shelves the rail knows, in reading order, then any shelf the data brings that it does
  // not: a group named only in the snapshot used to vanish from the rail with every model on
  // it (the four chaotic benchmarks sat in the data and nowhere on screen). "Other" stays last.
  const known = ["Circuits", "Mechanical", "Thermal", "Stiff benchmarks", "Hybrid / events"];
  const extra = Object.keys(groups).filter((g) => !known.includes(g) && g !== "Other").sort();
  const order = [...known, ...extra, "Other"];
  const frag = document.createDocumentFragment();
  for (const g of order) {
    if (!groups[g]) continue;
    const h = document.createElement("div"); h.className = "grp"; h.textContent = g;
    frag.appendChild(h);
    for (const i of groups[g]) {
      const m = MODELS[i];
      const item = document.createElement("div");
      item.className = "item"; item.tabIndex = 0; item.dataset.i = i;
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = m.model;
      const mt = document.createElement("span"); mt.className = "mt";
      mt.textContent = m.nstates + "s" + (m.events.length ? " · " + m.events.length + "e" : "");
      item.append(nm, mt);
      item.onclick = () => select(i);
      item.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(i); } };
      frag.appendChild(item);
    }
  }
  rail.replaceChildren(frag);
  document.getElementById("count").textContent =
    MODELS.length + " models · " + MODELS.reduce((a, m) => a + m.events.length, 0) + " events";
}

// The integrator this run used, beside the version badge: the model's own .toml method and
// tolerance (VanDerPol asks for LSODA at 1e-9, the roaster for 1e-11), so what the panel
// shows is what the corpus tests check, and a reader can tell at a glance.
function paintSolver() {
  const el = document.getElementById("solver");
  if (!el) return;
  const s = D && D.solver;
  if (!s || !s.method) { el.textContent = ""; return; }
  const tol = Number(s.tolerance);
  // A star marks a display tolerance -- the run is drawn faster than the model's reference and,
  // on a chaotic model, along a different path; no star means the model's own reference run.
  const shown = tol.toExponential(0).replace("e-", "e-").replace("e+", "e");
  const exact = D.tolerance === null || D.tolerance === undefined;
  el.textContent = Number.isFinite(tol) ? s.method + " · " + shown + (exact ? "" : "*") : s.method;
  el.title = exact
    ? "the model's own reference run: its .toml method and tolerance"
    : "a display tolerance for speed (the * ); pick 'exact' to reproduce the model's reference run";
}

function select(i) {
  D = MODELS[i];
  paintSolver();
  names = Object.keys(D.series);
  T = D.t; N = T.length;
  // The runs. In the corpus the one run simply follows the model shown; live, the last run is
  // this data (its overrides are the panel's) and earlier ones are pinned comparisons, brought
  // onto the new time grid.
  if (!LIVE || !RUNS.length) RUNS = [{overrides: overrides, data: D, onBase: null}];
  else { RUNS[RUNS.length - 1].data = D; RUNS[RUNS.length - 1].overrides = overrides; }
  for (let k = 0; k < RUNS.length - 1; k++) rebase(RUNS[k]);
  // A re-run of the same model keeps the selection, the scale and -- if the stop did not move
  // -- the zoom, so editing a parameter does not throw away the view being compared.
  const same = lastModel === D.model && on.size > 0;
  const stopMoved = !N || Math.abs(T[N - 1] - prevEnd) > 1e-9;
  if (!same || stopMoved) win = N ? [T[0], T[N - 1]] : [0, 1];
  lastModel = D.model; prevEnd = N ? T[N - 1] : 0;
  if (!same) {
    // open on the moving variables
    on = new Set(names.filter((nm) => {
      const v = D.series[nm]; let a = v[0];
      for (const x of v) if (x !== a) return true;
      return false;
    }));
    if (!on.size) on = new Set(names);
    // A single open .mo opens on its states in split mode: each state gets its own strip, so a
    // model whose variables span decades (a temperature beside a mass) is legible at a glance.
    if (MODELS.length === 1 && Array.isArray(D.states) && D.states.length) {
      on = new Set(D.states.filter((s) => names.includes(s)));
      scale = "units";
      document.getElementById("scale").value = "units";
    }
  }
  document.querySelectorAll(".item").forEach((el) => el.classList.toggle("on", +el.dataset.i === i));
  document.getElementById("mname").textContent = D.model;
  const mdesc = document.getElementById("mdesc");
  mdesc.textContent = D.summary || "";
  mdesc.title = D.summary || "";  // the desc is clamped to two lines; hover shows the whole path
  // A live .mo gets an editable stop control instead of the pills; the corpus keeps its pills.
  const stopwrap = document.getElementById("stopwrap");
  if (LIVE) {
    stopwrap.hidden = false;
    document.getElementById("stop").value = cleanStop(toT(D.stop));
    document.getElementById("stopunit").textContent = " " + tUnit();
    document.getElementById("mchips").replaceChildren();
  } else {
    stopwrap.hidden = true;
    const cf = document.createDocumentFragment();
    const chip = (t, tag) => { const s = document.createElement("span");
      s.className = "chip" + (tag ? " tag" : ""); s.textContent = t; cf.appendChild(s); };
    chip(D.nstates + " state" + (D.nstates > 1 ? "s" : ""));
    chip("t → " + fmt(D.stop));
    if (D.events.length) chip(D.events.length + " event" + (D.events.length > 1 ? "s" : ""));
    if (D.refs.length) chip(D.refs.length + " reference point" + (D.refs.length > 1 ? "s" : ""));
    (D.tags || []).slice(0, 3).forEach((t) => chip(t, true));
    document.getElementById("mchips").replaceChildren(cf);
  }
  document.getElementById("pin").hidden = !LIVE;
  document.getElementById("logbtn").hidden = !vscodeApi;
  paintEvents();
  paintXAxis();
  paintParams();
  paintRuns();
  paintSweep();
  paintLogs();
  paintSensitivity();
  draw();
  // An automatic stop says where it landed and why, until the pointer moves on.
  // The footer was showing "re-simulating …" while the run ran: now it has landed, say what
  // an automatic stop found, or give the rest text, rather than leaving the notice until the
  // next hover.
  foot.textContent = settledFooter();
}

// -- helpers ---------------------------------------------------------------------------
function fmt(v) {
  if (v === null || v === undefined || !isFinite(v)) return "--";
  const a = Math.abs(v);
  if (a !== 0 && (a < 1e-4 || a >= 1e6)) return v.toExponential(3);
  return String(Number(v.toPrecision(6)));
}
// Time in the unit the axis is set to. The whole trajectory is in seconds -- win, X(), events,
// the stop the simulator gets -- and only what is shown to a person converts: a 863 s roast
// reads as 14.4 min. `toT` seconds->shown, `fromT` shown->seconds, `tUnit` the label.
const TSCALE = { s: 1, min: 60 };
function tUnit() { return timeMode; }
function toT(seconds) { return seconds / TSCALE[timeMode]; }
function fromT(shown) { return shown * TSCALE[timeMode]; }
// A stop time a person can read in the field. A drag or an automatic stop lands on a value like
// 831.023458281 s; four significant figures keeps the sub-second detail that matters on a short
// run (2.584) and drops the meaningless tail on a long one (831).
function cleanStop(v) { return v > 0 ? Number(v.toPrecision(4)) : 0; }

// -- display units ---------------------------------------------------------------------
// The data stays SI; only what is printed converts, through this table, so a kelvin reads as
// the celsius you have intuition for. Affine per unit, with the inverse for reading a typed
// value back. A table rather than a special case, so more conversions can follow.
const DISPLAY = { c: { K: { unit: "°C", to: (v) => v - 273.15, from: (v) => v + 273.15 } } };
function dispOf(unit) { const t = DISPLAY[dispMode]; return (t && t[unit]) || null; }
// A rate per second follows the time axis: with the axis in minutes, K/s is shown as K/min
// (x60). That is the roaster's rate of rise, and in °C mode it reads °C/min -- the same number,
// since an offset cancels in a rate, only the label changes.
function rateScale(unit) { return timeMode === "min" && /\/s$/.test(unit) ? 60 : 1; }
function disp(v, unit) {
  if (v === null || v === undefined || !isFinite(v)) return v;
  const c = dispOf(unit);
  return (c ? c.to(v) : v) * rateScale(unit);
}
function undisp(v, unit) { const x = v / rateScale(unit); const c = dispOf(unit); return c ? c.from(x) : x; }
// The unit as printed: converted when the display mode says so, rates in the axis's time unit,
// and Modelica's "degC" spelled °C.
function dispUnit(unit) {
  const c = dispOf(unit); if (c) return c.unit;
  let u = unit === "degC" ? "°C" : unit;
  if (timeMode === "min" && /\/s$/.test(u)) u = u.replace(/\/s$/, "/min");
  if (dispMode === "c" && /^K\//.test(u)) u = u.replace(/^K\//, "°C/");
  return u;
}
function unitOf(nm) { return (D && D.units && D.units[nm] !== undefined) ? D.units[nm] : ""; }
// The one unit every selected variable shares, else "": an overlay axis can only be labelled
// in display units when everything on it converts the same way.
function sharedUnit() {
  const us = new Set(selected().map(unitOf));
  return us.size === 1 ? [...us][0] : "";
}

// -- runs --------------------------------------------------------------------------------
// A pinned run's series, linearly interpolated onto the live run's time grid: outside the
// pinned run's span the value is null, so its line simply ends there.
function interp(t, v, grid) {
  const out = new Array(grid.length).fill(null);
  const n = t.length; if (!n) return out;
  let j = 0;
  for (let i = 0; i < grid.length; i++) {
    const g = grid[i];
    if (g < t[0] || g > t[n - 1]) continue;
    while (j < n - 2 && t[j + 1] < g) j++;
    const t0 = t[j], t1 = t[j + 1], v0 = v[j], v1 = v[j + 1];
    if (v0 === null || v1 === null || v1 === undefined) { out[i] = v0 === null ? null : v0; continue; }
    out[i] = t1 > t0 ? v0 + (v1 - v0) * (g - t0) / (t1 - t0) : v0;
  }
  return out;
}
function rebase(run) {
  run.onBase = {};
  if (!run.data || !run.data.series) return;
  for (const nm of Object.keys(run.data.series)) run.onBase[nm] = interp(run.data.t, run.data.series[nm], T);
}
// The live run draws solid and full; a pinned one dashed, by how far back it was pinned.
const DASHES = ["6 4", "2 3", "9 3 2 3", "1 3"];
function runStyle(ri) {
  const back = RUNS.length - 1 - ri;
  return back === 0 ? {dash: null, w: 1.8, op: 1}
    : {dash: DASHES[Math.min(back - 1, DASHES.length - 1)], w: 1.4, op: .85};
}
function seriesOf(ri, nm) {
  return ri === RUNS.length - 1 ? (D.series[nm] || null) : ((RUNS[ri].onBase || {})[nm] || null);
}
function eachRun(nm, fn) {
  for (let ri = 0; ri < RUNS.length; ri++) { const vs = seriesOf(ri, nm); if (vs) fn(vs, ri); }
}
// One polyline for one run of one variable, in that variable's colour and that run's style.
function drawPath(frag, vs, a, b, yOf, nm, ri) {
  const st = runStyle(ri);
  let d = "", pen = false;
  for (let k = a; k <= b; k++) {
    const v = vs[k]; const y = (v === null || v === undefined || !isFinite(v)) ? null : yOf(v);
    if (y === null || !isFinite(y)) { pen = false; continue; }
    // In a phase plot the x is this run's phase variable at the same instant; a point outside
    // the x zoom lifts the pen so the curve is clipped rather than drawn across the frame.
    const xv = xOfRun(ri, k);
    if (xv === null || xv === undefined || !isFinite(xv) || (xwin && (xv < xwin[0] || xv > xwin[1]))) { pen = false; continue; }
    d += (pen ? "L" : "M") + X(xv).toFixed(2) + " " + y.toFixed(2); pen = true;
  }
  if (!d) return;
  const attrs = {d: d, fill: "none", "stroke-width": st.w, stroke: colour(nm),
    "stroke-linejoin": "round", opacity: st.op};
  if (st.dash) attrs["stroke-dasharray"] = st.dash;
  frag.appendChild(el("path", attrs));
}
function ticks(lo, hi, want) {
  if (!(hi > lo)) return [lo];
  const raw = (hi - lo) / want;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  const step = (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(v);
  return out;
}
function spanPad(lo, hi) {
  if (!(isFinite(lo) && isFinite(hi))) return [0, 1];
  if (hi > lo) { const pad = (hi - lo) * 0.06; return [lo - pad, hi + pad]; }
  const pad = Math.abs(lo) * 0.06 || 1;
  return [lo - pad, lo + pad];
}
function index(t) {
  let lo = 0, hi = N - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (T[mid] < t) lo = mid + 1; else hi = mid; }
  return lo;
}
function visible() { return [Math.max(0, index(win[0]) - 1), Math.min(N - 1, index(win[1]) + 1)]; }
function selected() { return names.filter((nm) => on.has(nm)); }
function colour(nm) { return PALETTE[names.indexOf(nm) % PALETTE.length]; }
function el(tag, attrs, text) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (text !== undefined) node.textContent = text;
  return node;
}

// -- scales ----------------------------------------------------------------------------
function bounds() {
  const [a, b] = visible();
  if (scale === "norm") return [0, 1];
  let lo = Infinity, hi = -Infinity;
  for (const nm of selected()) {
    eachRun(nm, (vs) => {
      for (let i = a; i <= b; i++) {
        let v = vs[i]; if (v === null || !isFinite(v)) continue;
        if (scale === "log") { v = Math.abs(v); if (!(v > 0)) continue; v = Math.log10(v); }
        if (v < lo) lo = v; if (v > hi) hi = v;
      }
    });
    // include reference points in range
    if (scale === "linear" && !xVar) for (const rf of D.refs) {
      const rv = rf.values[nm]; if (rv === undefined) continue;
      if (rv < lo) lo = rv; if (rv > hi) hi = rv;
    }
  }
  if (!isFinite(lo)) return [0, 1];
  return spanPad(lo, hi);
}
function extent(nm) {
  const [a, b] = visible();
  let lo = Infinity, hi = -Infinity;
  eachRun(nm, (vs) => {
    for (let i = a; i <= b; i++) { const v = vs[i]; if (v === null || !isFinite(v)) continue;
      if (v < lo) lo = v; if (v > hi) hi = v; }
  });
  if (!isFinite(lo)) return [0, 1];
  return hi > lo ? [lo, hi] : [lo, lo + 1];
}
function project(nm, dom) {
  if (scale === "norm") { const [lo, hi] = extent(nm); return (v) => (v - lo) / (hi - lo); }
  if (scale === "log") return (v) => (Math.log10(Math.abs(v)) - dom[0]) / (dom[1] - dom[0]);
  return (v) => (v - dom[0]) / (dom[1] - dom[0]);
}
// X maps a value of the x-axis domain -- time, or the phase variable -- onto the plot; `XD` is
// that domain, set once per draw() by xdom(). The inverse, for the pointer, is domAt().
const lg = (v) => Math.log10(Math.max(v, TFLOOR));
const logTime = () => LOGT && !xVar;
const X = (v) => {
  const [a, b] = logTime() ? [lg(XD[0]), lg(XD[1])] : XD;
  const u = logTime() ? lg(v) : v;
  return M.l + ((u - a) / (b - a)) * (box.w - M.l - M.r);
};
// The inverse of X over a domain: the value at fraction `f` of the plot's width.
function domAt(f, dom) {
  if (logTime()) { const a = lg(dom[0]), b = lg(dom[1]); return Math.pow(10, a + f * (b - a)); }
  return dom[0] + f * (dom[1] - dom[0]);
}
function lgFloor() {
  let m = Infinity;
  for (let k = 0; k < N; k++) { const v = T[k]; if (v > 0 && v < m) m = v; }
  return isFinite(m) ? m : 1e-12;
}
// The x value of run `ri` at time index `k`: the time itself, or that run's phase variable.
function xOfRun(ri, k) {
  if (!xVar) return T[k];
  const vs = seriesOf(ri, xVar); return vs ? vs[k] : null;
}
// The x domain: the time window, or the phase variable's range over the visible instants
// across every run (unless zoomed into `xwin`), padded so the curve does not touch the frame.
function xdom() {
  if (!xVar) return win;
  if (xwin) return xwin;
  const [a, b] = visible();
  let lo = Infinity, hi = -Infinity;
  for (let ri = 0; ri < RUNS.length; ri++) {
    const vs = seriesOf(ri, xVar); if (!vs) continue;
    for (let k = a; k <= b; k++) { const v = vs[k]; if (v === null || v === undefined || !isFinite(v)) continue;
      if (v < lo) lo = v; if (v > hi) hi = v; }
  }
  return isFinite(lo) ? spanPad(lo, hi) : [0, 1];
}
const Y = (u) => box.h - M.b - u * (box.h - M.t - M.b);

// -- drawing ---------------------------------------------------------------------------
function draw() {
  if (!D) return;
  readBg();
  box = {w: svg.clientWidth, h: svg.clientHeight};
  // A narrow pane cannot spare 60px of gutter; tighten it so the plot keeps its width.
  M.l = box.w < 360 ? 40 : box.w < 520 ? 50 : 60;
  svg.setAttribute("viewBox", "0 0 " + box.w + " " + box.h);
  const frag = document.createDocumentFragment();

  // The x domain for this draw: the time window, or the phase variable's range.
  XD = xdom();
  TFLOOR = lgFloor();

  // Shared frame: the x grid and the two axes, full height. Against time, ticks are laid at
  // round values of the *shown* time unit (whole minutes, say) and mapped back to seconds for
  // their x, so the axis reads 0, 2, 4 min rather than 0, 120, 240. Against a variable, the
  // same in that variable's display unit, with the variable named at the axis's right end.
  const xu = xVar ? unitOf(xVar) : "";
  const shown = xVar ? (v) => disp(v, xu) : toT;
  const back = xVar ? (v) => undisp(v, xu) : fromT;
  // On a log time axis the ticks are the decades of the shown unit -- 1, 10, 100 min in
  // minutes, not the seconds' decades relabelled as 1.667, 16.67 -- mapped back to seconds.
  const xticks = logTime()
    ? (() => {
        const out = [];
        const lo = Math.log10(shown(Math.max(XD[0], TFLOOR))), hi = Math.log10(shown(XD[1]));
        for (let k = Math.ceil(lo - 1e-9); k <= Math.floor(hi + 1e-9); k++) out.push(back(Math.pow(10, k)));
        return out;
      })()
    : ticks(shown(XD[0]), shown(XD[1]), Math.max(2, Math.round(box.w / 90))).map(back);
  for (const tv of xticks) {
    const x = X(tv);
    if (x < M.l - 0.5 || x > box.w - M.r + 0.5) continue;
    frag.appendChild(el("line", {class: "grid", x1: x, x2: x, y1: M.t, y2: box.h - M.b}));
    frag.appendChild(el("text", {class: "tick", x: x, y: box.h - 9, "text-anchor": "middle"}, fmt(shown(tv))));
  }
  if (xVar) {
    frag.appendChild(el("text", {class: "tick", x: box.w - M.r, y: box.h - M.b - 5, "text-anchor": "end",
      "font-weight": 600}, xVar + (dispUnit(xu) ? "  " + dispUnit(xu) : "")));
  }
  frag.appendChild(el("line", {class: "axis", x1: M.l, x2: M.l, y1: M.t, y2: box.h - M.b}));
  frag.appendChild(el("line", {class: "axis", x1: M.l, x2: box.w - M.r, y1: box.h - M.b, y2: box.h - M.b}));

  // Instants -- events and the stop -- are vertical lines against time only; in a phase plot
  // an instant is a point on a curve, not a column of the plane.
  if (!xVar) {
    for (const e of D.events) {
      if (e.t < win[0] || e.t > win[1]) continue;
      frag.appendChild(el("line", {class: "event", x1: X(e.t), x2: X(e.t), y1: M.t, y2: box.h - M.b}));
    }
    // A pinned run's events, fainter: where its schedule fired may differ from the live run's.
    for (let ri = 0; ri < RUNS.length - 1; ri++) {
      for (const e of ((RUNS[ri].data || {}).events || [])) {
        if (e.t < win[0] || e.t > win[1]) continue;
        frag.appendChild(el("line", {class: "event pin", x1: X(e.t), x2: X(e.t), y1: M.t, y2: box.h - M.b}));
      }
    }
    // The stop marker: where the run ends, drawn as a handle. Drag it left to trim the horizon
    // or past the right edge to extend it; letting go re-simulates to there. A live .mo only,
    // since the corpus gallery cannot re-simulate.
    if (LIVE && N && D.stop >= win[0] && D.stop <= win[1] * (1 + 1e-9)) {
      frag.appendChild(stopMarker(X(Math.min(D.stop, win[1]))));
    }
  }

  if (scale === "split") drawSplit(frag);
  else if (scale === "units") drawUnits(frag);
  else drawOverlay(frag);

  drawMarks(frag);
  plot.replaceChildren(frag);
  hud.replaceChildren();
  paintLegend();
}

// One shared y-scale, every selected variable on it. `linear`, `log |y|`, `normalised`.
function drawOverlay(frag) {
  const dom = bounds();
  // Ticks in display units when everything selected shares one unit (all temperatures, say):
  // laid at round display values and mapped back to data space. Otherwise plain SI.
  const su = scale === "linear" ? sharedUnit() : "";
  if (scale !== "norm") {
    const lo = scale === "linear" ? disp(dom[0], su) : dom[0];
    const hi = scale === "linear" ? disp(dom[1], su) : dom[1];
    for (const dv of ticks(lo, hi, Math.max(2, Math.round(box.h / 44)))) {
      const v = scale === "linear" ? undisp(dv, su) : dv;
      const y = Y((v - dom[0]) / (dom[1] - dom[0]));
      if (y < M.t - 0.5 || y > box.h - M.b + 0.5) continue;
      frag.appendChild(el("line", {class: "grid", x1: M.l, x2: box.w - M.r, y1: y, y2: y}));
      frag.appendChild(el("text", {class: "tick", x: M.l - 6, y: y + 3, "text-anchor": "end"},
        scale === "log" ? "1e" + fmt(dv) : fmt(dv)));
    }
  }
  const [a, b] = visible();
  for (const nm of selected()) {
    const to = project(nm, dom);
    eachRun(nm, (vs, ri) => drawPath(frag, vs, a, b, (v) => Y(to(v)), nm, ri));
    drawLogPoints(frag, nm, (v) => Y(to(v)));
  }
  if (scale === "linear" && !xVar) for (const rf of D.refs) {
    if (rf.t < win[0] || rf.t > win[1]) continue;
    for (const nm of selected()) {
      const rv = rf.values[nm]; if (rv === undefined) continue;
      const u = (rv - dom[0]) / (dom[1] - dom[0]);
      const cx = X(rf.t), cy = Y(u);
      frag.appendChild(el("circle", {cx: cx, cy: cy, r: 4.5, fill: cssbg,
        stroke: colour(nm), class: "refring"}));
      frag.appendChild(el("circle", {cx: cx, cy: cy, r: 1.7, fill: colour(nm)}));
    }
  }
}

// A strip's min and max, its max at the top edge and its min at the bottom. A constant series
// has min == max, which would stack the same number on itself, so it prints once at the middle
// -- what fixed the duplicated "1.794" a flat mass drew in the by-unit view.
// Four significant figures for an edge label: the gutter is 40px on a narrow pane, where
// fmt's six ("515.563") clipped to a misleading "15.563". Precision belongs to the legend readout.
function fmtEdge(v) {
  if (v === null || v === undefined || !isFinite(v)) return "--";
  const a = Math.abs(v);
  if (a !== 0 && (a < 1e-3 || a >= 1e5)) return v.toExponential(2);
  return String(Number(v.toPrecision(4)));
}
function stripLabels(frag, lo, hi, y0, y1) {
  if (hi - lo > (Math.abs(hi) || 1) * 1e-9) {
    frag.appendChild(el("text", {class: "tick", x: M.l - 6, y: y0 + 8, "text-anchor": "end"}, fmtEdge(hi)));
    frag.appendChild(el("text", {class: "tick", x: M.l - 6, y: y1, "text-anchor": "end"}, fmtEdge(lo)));
  } else {
    frag.appendChild(el("text", {class: "tick", x: M.l - 6, y: (y0 + y1) / 2 + 3,
      "text-anchor": "end"}, fmtEdge(lo)));
  }
}

// Each selected variable in its own horizontal strip with its own y-scale, so a signal near
// zero stays legible beside one in the hundreds. This is the "split" answer to a model like
// RoastingMachine, where m_w would be a flat line at the foot of the temperatures.
function drawSplit(frag) {
  const rows = selected();
  if (!rows.length) return;
  const top = M.t, bottom = box.h - M.b, gap = 12;
  const stripH = (bottom - top) / rows.length;
  const [a, b] = visible();
  rows.forEach((nm, i) => {
    const y0 = top + i * stripH + (i ? gap / 2 : 2);
    const y1 = top + (i + 1) * stripH - gap / 2;
    if (i) frag.appendChild(el("line", {class: "grid", x1: M.l, x2: box.w - M.r,
      y1: top + i * stripH, y2: top + i * stripH}));
    const u = unitOf(nm);
    let lo = Infinity, hi = -Infinity;
    eachRun(nm, (vs) => {
      for (let k = a; k <= b; k++) { const v = vs[k]; if (v === null || !isFinite(v)) continue;
        if (v < lo) lo = v; if (v > hi) hi = v; }
    });
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    const dataLo = lo, dataHi = hi;
    const pad = hi > lo ? (hi - lo) * 0.08 : (Math.abs(lo) * 0.08 || 1);
    lo -= pad; hi += pad;
    const yFor = (v) => y1 - ((v - lo) / (hi - lo)) * (y1 - y0);
    eachRun(nm, (vs, ri) => drawPath(frag, vs, a, b, yFor, nm, ri)); drawLogPoints(frag, nm, yFor);
    if (!xVar) for (const rf of D.refs) { const rv = rf.values[nm];
      if (rv === undefined || rf.t < win[0] || rf.t > win[1]) continue;
      const cx = X(rf.t), cy = yFor(rv);
      frag.appendChild(el("circle", {cx: cx, cy: cy, r: 4.5, fill: cssbg, stroke: colour(nm), class: "refring"}));
      frag.appendChild(el("circle", {cx: cx, cy: cy, r: 1.7, fill: colour(nm)}));
    }
    frag.appendChild(el("text", {x: M.l + 5, y: y0 + 10, fill: colour(nm),
      "font-size": 10, "font-weight": 600}, nm + (u ? "  " + dispUnit(u) : "")));
    stripLabels(frag, disp(dataLo, u), disp(dataHi, u), y0, y1);
  });
}

// Strips grouped by physical unit: variables that share a unit (the temperatures, in K) share
// one strip and one scale, so they are directly comparable; a different unit (kg) is its own
// strip. The unit labels the strip and each variable keeps its colour. This is the default a
// single .mo opens on, so RoastingMachine's three temperatures sit together, m_w on its own.
function drawUnits(frag) {
  const rows = selected();
  if (!rows.length) return;
  const groups = new Map();
  for (const nm of rows) {
    const u = (D.units && D.units[nm] !== undefined) ? D.units[nm] : "";
    if (!groups.has(u)) groups.set(u, []);
    groups.get(u).push(nm);
  }
  const units = [...groups.keys()];
  const top = M.t, bottom = box.h - M.b, gap = 12;
  // Height by how many variables a unit holds, so three temperatures get a tall strip and a
  // lone mass gets a short one, instead of a flat line owning half the pane. Boundaries are
  // the running sum of the weights, scaled to fill the plot.
  const weight = units.map((u) => Math.max(1, groups.get(u).length));
  const total = weight.reduce((s, x) => s + x, 0);
  const edge = [top];
  for (let k = 0; k < units.length; k++) edge.push(edge[k] + (bottom - top) * weight[k] / total);
  const [a, b] = visible();
  units.forEach((u, i) => {
    const members = groups.get(u);
    const y0 = edge[i] + (i ? gap / 2 : 2);
    const y1 = edge[i + 1] - gap / 2;
    if (i) frag.appendChild(el("line", {class: "grid", x1: M.l, x2: box.w - M.r,
      y1: edge[i], y2: edge[i]}));
    let lo = Infinity, hi = -Infinity;
    for (const nm of members) eachRun(nm, (vs) => {
      for (let k = a; k <= b; k++) { const v = vs[k]; if (v === null || !isFinite(v)) continue;
        if (v < lo) lo = v; if (v > hi) hi = v; }
    });
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    const dataLo = lo, dataHi = hi;
    const pad = hi > lo ? (hi - lo) * 0.08 : (Math.abs(lo) * 0.08 || 1);
    lo -= pad; hi += pad;
    const yFor = (v) => y1 - ((v - lo) / (hi - lo)) * (y1 - y0);
    for (const nm of members) {
      eachRun(nm, (vs, ri) => drawPath(frag, vs, a, b, yFor, nm, ri)); drawLogPoints(frag, nm, yFor);
      if (!xVar) for (const rf of D.refs) { const rv = rf.values[nm];
        if (rv === undefined || rf.t < win[0] || rf.t > win[1]) continue;
        const cx = X(rf.t), cy = yFor(rv);
        frag.appendChild(el("circle", {cx: cx, cy: cy, r: 4.5, fill: cssbg, stroke: colour(nm), class: "refring"}));
        frag.appendChild(el("circle", {cx: cx, cy: cy, r: 1.7, fill: colour(nm)}));
      }
    }
    stripLabels(frag, disp(dataLo, u), disp(dataHi, u), y0, y1);
    const unitLabel = dispUnit(u) || "(dimensionless)";
    let lx = M.l + 5;
    frag.appendChild(el("text", {class: "tick", x: lx, y: y0 + 10, "font-weight": 600}, unitLabel));
    lx += unitLabel.length * 6.5 + 12;
    for (const nm of members) {
      frag.appendChild(el("text", {x: lx, y: y0 + 10, fill: colour(nm), "font-size": 9}, nm));
      lx += nm.length * 6.2 + 9;
    }
  });
}

// -- legend, cursor --------------------------------------------------------------------
function paintLegend(at) {
  const frag = document.createDocumentFragment();
  for (const nm of names) {
    const row = document.createElement("div");
    row.className = "row" + (on.has(nm) ? "" : " off"); row.title = nm;
    const dot = document.createElement("span"); dot.className = "swatch";
    dot.style.background = colour(nm);
    const name = document.createElement("span"); name.className = "name"; name.textContent = nm;
    const value = document.createElement("span"); value.className = "value";
    if (at !== undefined && on.has(nm)) {
      // One value per run in run order (A │ B ...), in display units.
      const u = unitOf(nm);
      value.textContent = RUNS.map((_, ri) => {
        const vs = seriesOf(ri, nm); return fmt(disp(vs ? vs[at] : null, u));
      }).join(" │ ");
    }
    row.append(dot, name, value);
    row.onclick = () => { on.has(nm) ? on.delete(nm) : on.add(nm); draw(); };
    frag.appendChild(row);
  }
  legend.replaceChildren(frag);
}
// The instant under the pointer. Against time it is the nearest sample in time; in a phase plot
// it is the sample whose phase-variable value, over every selected variable and run, sits
// nearest the pointer's x -- the curve may fold back on itself, so this picks the closest.
function nearestIndex(v) {
  if (!xVar) {
    const i = index(v);
    return i > 0 && Math.abs(T[i - 1] - v) < Math.abs(T[i] - v) ? i - 1 : i;
  }
  const [a, b] = visible();
  let best = a, dist = Infinity;
  for (let ri = 0; ri < RUNS.length; ri++) {
    const vs = seriesOf(ri, xVar); if (!vs) continue;
    for (let k = a; k <= b; k++) {
      const xv = vs[k]; if (xv === null || xv === undefined || !isFinite(xv)) continue;
      const d = Math.abs(xv - v); if (d < dist) { dist = d; best = k; }
    }
  }
  return best;
}
function cursor(v) {
  const j = nearestIndex(v);
  const x = X(xOfRun(RUNS.length - 1, j) ?? v);
  const frag = document.createDocumentFragment();
  frag.appendChild(el("line", {class: "cursor", x1: x, x2: x, y1: M.t, y2: box.h - M.b}));
  // Dots on the shared scale; the strip modes have a scale per strip, so their readout is the legend.
  if (scale !== "split" && scale !== "units") {
    const dom = bounds();
    for (const nm of selected()) {
      const to = project(nm, dom);
      eachRun(nm, (vs, ri) => {
        const v = vs[j]; if (v === null || v === undefined || !isFinite(v)) return;
        const u = to(v); if (!isFinite(u)) return;
        const cx = X(xOfRun(ri, j) ?? v); if (!isFinite(cx)) return;
        frag.appendChild(el("circle", {cx: cx, cy: Y(u), r: 2.6, fill: colour(nm), opacity: runStyle(ri).op}));
      });
    }
  }
  hud.replaceChildren(frag);
  // Against time the footer names any event under the cursor; in a phase plot it reads the
  // phase variable first, then the instant that point belongs to.
  const near = xVar ? [] : D.events.filter((e) => Math.abs(X(e.t) - x) < 4);
  const xu = xVar ? unitOf(xVar) : "";
  const phase = xVar ? xVar + " = " + fmt(disp(xOfRun(RUNS.length - 1, j), xu)) + (dispUnit(xu) ? " " + dispUnit(xu) : "") + "   ·   " : "";
  // The values under the cursor live in the legend. With the legend out of sight -- a narrow
  // pane that has not opened it -- they have nowhere to show but here: the first few selected
  // variables of the live run, in display units.
  const legendShown = getComputedStyle(document.querySelector(".legend")).display !== "none";
  const vals = legendShown ? "" : selected().slice(0, 4).map((nm) => {
    const u = unitOf(nm), vs = seriesOf(RUNS.length - 1, nm);
    const v = vs ? disp(vs[j], u) : null;
    return v === null || v === undefined || !isFinite(v) ? null : nm + " " + fmt(v) + (dispUnit(u) ? " " + dispUnit(u) : "");
  }).filter(Boolean).join("   ·   ");
  foot.textContent = phase + "t = " + fmt(toT(T[j])) + " " + tUnit() + (near.length ? "   ⟨ " + (near[0].cause || "event") + " ⟩" : "") + (vals ? "   ·   " + vals : "");
  paintLegend(j);
}

// -- sensitivity ---------------------------------------------------------------------------
// Which parameter moves the response most. The simulator runs every editable parameter a step
// either way and reads the response off each (2N runs, so an explicit action); the answer
// comes back on the live run's record as `sensitivity`, drawn here as a tornado: one row per
// parameter, a bar from the response at -step to the one at +step around the base, widest
// first. A response that does not exist at an end -- the drop event never fired at -5% of
// UA, say -- is written as such rather than drawn as zero.
let sensPicked = false;
function paintSensitivity() {
  const title = document.getElementById("ntitle"), ctl = document.getElementById("sensctl");
  const show = LIVE && editableParams().length > 0;
  title.hidden = ctl.hidden = !show;
  if (!show) return;
  const sel = document.getElementById("nresp");
  const choices = responseChoices();
  const keep = sel.value;
  sel.replaceChildren(...choices.map((c) => { const o = document.createElement("option"); o.value = c.key; o.textContent = c.label; return o; }));
  const dropChoice = choices.find((c) => c.kind === "event" && /T_drop/.test(c.cause));
  const fallback = choices.find((c) => c.kind === "final" && Array.isArray(D.states) && c.name === D.states[0]) || choices[0];
  if (D.sensitivity && choices.some((c) => c.key === D.sensitivity.response)) sel.value = D.sensitivity.response;
  else if (dropChoice && !sensPicked) sel.value = dropChoice.key;
  else if (choices.some((c) => c.key === keep)) sel.value = keep;
  else sel.value = fallback ? fallback.key : "";
  drawTornado();
}
function runSensitivity() {
  if (!vscodeApi) { foot.textContent = "a sensitivity study needs the extension to re-simulate"; return; }
  const key = document.getElementById("nresp").value; if (!key) return;
  const pct = parseFloat(String(document.getElementById("nstep").value).replace(",", "."));
  const step = isFinite(pct) && pct > 0 ? pct / 100 : 0.05;
  foot.textContent = "sensitivity of " + key.replace(/^(final|event):/, "") + " to each parameter, ±" + Math.round(step * 100) + "% …";
  vscodeApi.postMessage({ type: "simulate", stop: D.stop, sets: overrides, runId: RUNS.length - 1, sensitivity: key, sstep: step });
}
function drawTornado() {
  const svgT = document.getElementById("tchart"); if (!svgT) return;
  const S = D && D.sensitivity;
  const key = document.getElementById("nresp").value;
  const w = svgT.clientWidth || 200;
  if (!S || S.response !== key || !S.rows || !S.rows.length) {
    svgT.setAttribute("viewBox", "0 0 " + w + " 24"); svgT.style.height = "24px";
    const frag = document.createDocumentFragment();
    frag.appendChild(el("text", {class: "tval", x: 0, y: 14}, S && S.rows && S.rows.length ? "computed for another response -- compute again" : "compute to see which parameter matters"));
    svgT.replaceChildren(frag); return;
  }
  const choice = responseChoices().find((c) => c.key === S.response);
  const isEvent = choice && choice.kind === "event";
  const u = choice && choice.kind === "final" ? unitOf(choice.name) : "";
  const shown = (v) => v === null || v === undefined ? null : (isEvent ? toT(v) : disp(v, u));
  const unitLabel = isEvent ? tUnit() : dispUnit(u);
  const rows = S.rows.map((r) => ({name: r.name, minus: shown(r.minus), plus: shown(r.plus)}));
  const base = shown(S.base);
  const rh = 18, top = 16, left = 74, right = 8, h = top + rows.length * rh + 6;
  svgT.setAttribute("viewBox", "0 0 " + w + " " + h); svgT.style.height = h + "px";
  const vals = rows.flatMap((r) => [r.minus, r.plus]).filter((v) => v !== null && isFinite(v));
  if (base !== null && isFinite(base)) vals.push(base);
  if (!vals.length) { svgT.replaceChildren(el("text", {class: "tmiss", x: 0, y: 14}, "the response is undefined at every step")); return; }
  const dom = spanPad(Math.min(...vals), Math.max(...vals));
  const TX = (v) => left + ((v - dom[0]) / (dom[1] - dom[0])) * (w - left - right);
  const frag = document.createDocumentFragment();
  frag.appendChild(el("text", {class: "tval", x: left, y: 10}, (choice ? choice.label : S.response) + (unitLabel ? "  (" + unitLabel + ")" : "") + "   ±" + Math.round(S.step * 100) + "%"));
  if (base !== null && isFinite(base)) frag.appendChild(el("line", {class: "tbase", x1: TX(base), x2: TX(base), y1: top, y2: h - 4}));
  rows.forEach((r, i) => {
    const y = top + i * rh;
    frag.appendChild(el("text", {class: "tname", x: left - 6, y: y + 12, "text-anchor": "end"}, r.name));
    const ok = r.minus !== null && r.plus !== null && isFinite(r.minus) && isFinite(r.plus);
    if (ok) {
      const x0 = TX(Math.min(r.minus, r.plus)), x1 = TX(Math.max(r.minus, r.plus));
      frag.appendChild(el("rect", {class: "tbar", x: x0, y: y + 3, width: Math.max(x1 - x0, 1.5), height: rh - 7, rx: 2}));
      frag.appendChild(el("text", {class: "tval", x: x1 + 4, y: y + 12}, "Δ " + fmt(r.plus - r.minus)));
    } else {
      const one = r.minus !== null && isFinite(r.minus) ? r.minus : (r.plus !== null && isFinite(r.plus) ? r.plus : null);
      if (one !== null) frag.appendChild(el("circle", {class: "tbar", cx: TX(one), cy: y + rh / 2 - 0.5, r: 3}));
      frag.appendChild(el("text", {class: "tmiss", x: one !== null ? TX(one) + 6 : left + 4, y: y + 12},
        one === null ? "undefined either way" : "undefined at " + (r.minus === null ? "−" : "+") + "step"));
    }
  });
  svgT.replaceChildren(frag);
}
document.getElementById("nresp").onchange = () => { sensPicked = true; drawTornado(); };
document.getElementById("nrun").onclick = runSensitivity;

// -- measured logs -------------------------------------------------------------------------
// A log's column for a model variable: the same name, or the same name ignoring case, so a
// roaster's "Probe" lines up with the model's `probe`. Nothing cleverer -- a wrong match would
// draw a measurement against the wrong quantity and look like a model error.
function logColumn(log, nm) {
  if (log.series[nm]) return log.series[nm];
  const key = Object.keys(log.series).find((k) => k.toLowerCase() === nm.toLowerCase());
  return key ? log.series[key] : null;
}
// The log's samples for one variable as hollow points, placed with the same y mapping as the
// variable's own curve (whichever mode is drawing), and along x by the log's clock -- or, in a
// phase plot, by the log's column for the phase variable, if it has one.
function drawLogPoints(frag, nm, yOf) {
  if (!LOGS.length) return;
  for (const log of LOGS) {
    const col = logColumn(log, nm); if (!col) continue;
    const xcol = xVar ? logColumn(log, xVar) : null;
    if (xVar && !xcol) continue;
    for (let k = 0; k < col.length; k++) {
      const v = col[k]; if (v === null || v === undefined || !isFinite(v)) continue;
      const xv = xVar ? xcol[k] : log.t[k] * log.tscale;
      if (xv === null || xv === undefined || !isFinite(xv) || xv < XD[0] || xv > XD[1]) continue;
      const y = yOf(v); if (!isFinite(y) || y < M.t - 1 || y > box.h - M.b + 1) continue;
      frag.appendChild(el("circle", {class: "logpt", cx: X(xv), cy: y, r: 2.4, stroke: colour(nm)}));
    }
  }
}
// The legend's account of each log: which columns found a variable, which did not, the clock's
// unit, and a way to drop it.
function paintLogs() {
  const title = document.getElementById("ltitle"), list = document.getElementById("loglist");
  title.hidden = !LOGS.length;
  const frag = document.createDocumentFragment();
  LOGS.forEach((log, li) => {
    const row = document.createElement("div"); row.className = "lrow";
    const head = document.createElement("div"); head.className = "lhead";
    const name = document.createElement("span"); name.className = "lname"; name.textContent = log.name; name.title = log.name;
    const unit = document.createElement("select"); unit.title = "the unit of the log's time column";
    for (const [v, t] of [["1", "s"], ["60", "min"]]) { const o = document.createElement("option"); o.value = v; o.textContent = t; unit.appendChild(o); }
    unit.value = String(log.tscale);
    unit.onchange = () => { log.tscale = Number(unit.value); draw(); };
    const x = document.createElement("span"); x.className = "x"; x.textContent = "×"; x.title = "remove this log";
    x.onclick = () => { LOGS.splice(li, 1); paintLogs(); draw(); };
    head.append(name, unit, x);
    const cols = document.createElement("div"); cols.className = "lcols";
    for (const c of Object.keys(log.series)) {

// -- continuation --------------------------------------------------------------------------
// Join a run's tail onto the run it continued: keep the base's samples up to where the tail
// took over, then the tail's after it (the tail's first instant repeats the checkpoint's, so
// it is dropped); series present on only one side are null-filled; events concatenate; the
// stop and the checkpoint are the tail's. What comes back is a whole run, as if simulated in
// one go, and `resumedFrom` is cleared so it is not stitched twice.

  let skip = 0; while (skip < tt.length && tt[skip] <= from * (1 + 1e-12)) skip++;

    const padA = a.length < cut ? new Array(cut - a.length).fill(null) : [];

    series[nm] = [...a, ...padA, ...b, ...padB];

    ...tail,
    t: [...bt.slice(0, cut), ...tt.slice(skip)],
    series,
    units: {...(base.units || {}), ...(tail.units || {})},
    events: [...(base.events || []).filter((e) => e.t <= from * (1 + 1e-12)), ...(tail.events || [])],
