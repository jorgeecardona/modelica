  // 300 ms after the last edit. Enter runs at once.
  let stopTimer = null;
  const scheduleReRun = () => { clearTimeout(stopTimer); stopTimer = setTimeout(() => { stopTimer = null; reRun(); }, 300); };
  stopInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); clearTimeout(stopTimer); stopTimer = null; reRun(); } });
  stopInput.addEventListener("input", scheduleReRun);
  stopInput.addEventListener("change", scheduleReRun);
}
document.getElementById("nextev").onclick = () => reRun("event");
document.getElementById("settle").onclick = () => reRun("settle");
document.getElementById("disp").onchange = (e) => { dispMode = e.target.value; paintParams(); paintRuns(); paintSweep(); draw(); };
// Pin: freeze the live run as a comparison. A copy with its overrides and data is inserted
// before the live one, so the live run stays last (solid, editable) and the pinned copy draws
// dashed behind it -- change a parameter and the two diverge on the same axes.
document.getElementById("pin").onclick = () => {
  if (!RUNS.length) return;
  const live = RUNS[RUNS.length - 1];
  const copy = {overrides: {...live.overrides}, data: live.data, onBase: null};
  RUNS.splice(RUNS.length - 1, 0, copy);
  rebase(copy);
  paintRuns(); paintSweep(); draw();
};

function paramUnit(name) {
  const p = ((D && D.parameters) || []).find((q) => q.name === name);
  return p ? p.unit : "";
}

// The runs as chips: A, B, ... in order, the live one last and outlined, each with its line
// style and what it overrides ("as written" for the model's own values); × drops a pinned run.
function paintRuns() {
  const holder = document.getElementById("runs");
  const show = LIVE && (RUNS.length > 1 || Object.keys(overrides).length > 0);
  holder.hidden = !show;
  if (!show) { holder.replaceChildren(); return; }
  const frag = document.createDocumentFragment();
  RUNS.forEach((run, ri) => {
    const live = ri === RUNS.length - 1;
    const chip = document.createElement("span"); chip.className = "run" + (live ? " live" : "");
    const st = runStyle(ri);
    const dash = document.createElement("span"); dash.className = "dash";
    dash.style.borderTopStyle = st.dash ? (st.dash.startsWith("2") || st.dash.startsWith("1") ? "dotted" : "dashed") : "solid";
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = String.fromCharCode(65 + ri);
    const what = document.createElement("span");
    const ov = Object.entries(run.overrides || {});
    what.textContent = ov.length
      ? ov.map(([k, v]) => k + " = " + fmt(disp(v, paramUnit(k))) + (dispUnit(paramUnit(k)) ? " " + dispUnit(paramUnit(k)) : "")).join(", ")
      : "as written";
    chip.append(dash, tag, what);
    if (!live) {
      const x = document.createElement("span"); x.className = "x"; x.textContent = "×"; x.title = "drop this run";
      x.onclick = () => { RUNS.splice(ri, 1); paintRuns(); paintSweep(); draw(); };
      chip.appendChild(x);
    }
    frag.appendChild(chip);
  });
  holder.replaceChildren(frag);
}

// The model's parameters, editable. A value typed here overrides the model's (the field is
// outlined and gets an undo), the live run re-simulates, and anything derived from it -- m_dry
// from m_green -- is recomputed by the simulator and shown read-only. Values print in display
// units and are read back in them: type 20 for T_amb with °C on and the model gets 293.15 K.
function paintParams() {
  const list = document.getElementById("plist"), title = document.getElementById("ptitle");
  const ps = (LIVE && D && D.parameters) || [];
  title.hidden = !ps.length;
  if (!ps.length) { list.replaceChildren(); return; }
  const frag = document.createDocumentFragment();
  for (const p of ps) {
    const row = document.createElement("div");
    row.className = "prow" + (p.derived ? " derived" : "");
    row.title = (p.doc || p.name) + (p.derived ? "  (derived: edit what it depends on)" : "");
    const nm = document.createElement("span"); nm.className = "pn"; nm.textContent = p.name;
    const unit = document.createElement("span"); unit.className = "pu"; unit.textContent = dispUnit(p.unit);
    const shown = disp(p.value, p.unit);
    if (p.derived) {
      const v = document.createElement("span"); v.className = "pv"; v.textContent = fmt(shown);
      row.append(nm, v, unit);
    } else {
      // A text field, not type=number: a number input prints in the browser's locale (293,15)
      // while the chart prints 293.15, and its spinner is useless for a physical constant. The
      // value is formatted here with a point, and a typed comma is accepted on the way back.
      const inp = document.createElement("input"); inp.type = "text"; inp.inputMode = "decimal";
      inp.spellcheck = false; inp.autocomplete = "off";
      inp.value = (shown !== null && isFinite(shown)) ? String(Number(shown.toPrecision(7))) : "";
      if (p.name in overrides) inp.classList.add("set");
      const apply = () => {
        const x = parseFloat(String(inp.value).trim().replace(",", ".")); if (!isFinite(x)) return;
        overrides[p.name] = undisp(x, p.unit); reRun();
      };
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); apply(); } });
      inp.addEventListener("change", apply);
      row.append(nm, inp, unit);
      if (p.name in overrides) {
        const undo = document.createElement("span"); undo.className = "undo"; undo.textContent = "↺";
        undo.title = "back to the model's value";
        undo.onclick = () => { delete overrides[p.name]; reRun(); };
        row.appendChild(undo);
      }
    }
    frag.appendChild(row);
  }
  list.replaceChildren(frag);
}

// The events, listed under the variables with their cause. Clicking one says "show me until
// here": a live .mo moves its stop to just past that event and re-runs; the corpus gallery,
// which cannot re-simulate, zooms the view to end there instead.
function paintEvents() {
  const evs = (D && D.events) || [];
  document.getElementById("evtitle").hidden = !evs.length;
  const frag = document.createDocumentFragment();
  for (const ev of evs) {
    const row = document.createElement("div");
    row.className = "evrow"; row.title = ev.cause || "event";
    const t = document.createElement("span"); t.className = "evt"; t.textContent = fmt(toT(ev.t));
    const c = document.createElement("span"); c.className = "evc"; c.textContent = ev.cause || "event";
    row.append(t, c);
    row.onclick = () => {
      const until = ev.t > 0 ? ev.t * 1.05 : (T[N - 1] || 1) * 0.02;
      if (LIVE && vscodeApi) { document.getElementById("stop").value = cleanStop(toT(until)); reRun(); }
      else { win = [T[0], Math.min(T[N - 1], until)]; draw(); }
    };
    frag.appendChild(row);
  }
  document.getElementById("evlist").replaceChildren(frag);
}

// A resizable legend: drag the splitter to set its width, double-click to collapse and again
// to bring it back. The width is a CSS variable the grid reads, so the chart re-lays out and
// redraws to whatever room is left.
const split = document.getElementById("split");
let splitDrag = false;
let legendWidth = 208;
function setLegend(px) {
  legendWidth = Math.max(0, Math.min(480, px));
  document.documentElement.style.setProperty("--legend-w", legendWidth + "px");
  document.body.classList.toggle("legend-collapsed", legendWidth < 40);
  draw();
}
split.addEventListener("pointerdown", (e) => { splitDrag = true; split.classList.add("on"); split.setPointerCapture(e.pointerId); });
split.addEventListener("pointermove", (e) => { if (splitDrag) setLegend(window.innerWidth - e.clientX - 3); });
split.addEventListener("pointerup", () => { splitDrag = false; split.classList.remove("on"); });
split.addEventListener("dblclick", () => setLegend(legendWidth < 40 ? 208 : 0));
// Narrow pane: the legend is hidden by the layout, and this button brings it back as a strip
// under the chart (see the 780px media query). Wide, the button itself is hidden.
const legendBtn = document.getElementById("legendbtn");
legendBtn.addEventListener("click", () => {
  const open = document.body.classList.toggle("legend-open");
  legendBtn.setAttribute("aria-pressed", open ? "true" : "false");
  draw();
});
window.addEventListener("message", (e) => {
  const m = e.data || {};
  if (m.type === "data" && m.models) {
    const rec = m.models[0];
    const liveIdx = RUNS.length - 1;
    const ri = (typeof m.runId === "number" && m.runId >= 0 && m.runId < RUNS.length) ? m.runId : liveIdx;
    if (ri === liveIdx) {
      // The live run defines the time grid: swap it in (select() rebases the pinned runs onto
      // it), then bring any pinned run whose stop differs -- an automatic stop may have moved
      // it -- to the same horizon, so the comparison covers the same span.
      // A continued run comes back as a tail from where it took over: append it to what is
      // already here, so the panel shows the whole trajectory without having re-run any of it.
      if (rec && rec.resumedFrom !== null && rec.resumedFrom !== undefined && D) m.models[0] = stitch(D, rec);
      MODELS = m.models; load();
      for (let k = 0; k < RUNS.length - 1; k++) {
        const have = (RUNS[k].data && RUNS[k].data.stop) || 0;
        if (vscodeApi && Math.abs(have - D.stop) > 1e-9) {
          // A pinned run extends the same way the live one does: from its own checkpoint when
          // the stop only grew, from scratch otherwise.
          const pk = RUNS[k].data && RUNS[k].data.checkpoint;
          const grew = D.stop > have * (1 + 1e-9);
          vscodeApi.postMessage({ type: "simulate", stop: D.stop, sets: RUNS[k].overrides, runId: k, resume: (pk && grew) ? pk : null });
        }
      }
    } else {
      const had = RUNS[ri].data;
      RUNS[ri].data = (rec.resumedFrom !== null && rec.resumedFrom !== undefined && had) ? stitch(had, rec) : rec;
      rebase(RUNS[ri]); paintRuns(); paintSweep(); draw();
      // The last run of a sweep has landed: the "sweeping …" notice has done its job.
      if (RUNS.every((r) => r.data)) foot.textContent = settledFooter();
    }
  }
  else if (m.type === "log" && m.t && m.series) {
    LOGS.push({name: m.name || "log", t: m.t, series: m.series, tscale: 1});
    // A column is drawn only for a variable that is switched on, and a log is usually about a
    // variable the panel does not open on -- the roaster opens on its states, and a roast log
    // holds `probe`, the alias it is measured through. Switch each matched variable on, so the
    // points show the moment the log arrives instead of listing a column with nothing drawn.
    let matched = 0;
    for (const col of Object.keys(m.series)) {
      const nm = names.find((n) => n.toLowerCase() === String(col).toLowerCase());
      if (nm) { on.add(nm); matched++; }
    }
    paintLogs(); draw();
    foot.textContent = "overlaid " + (m.name || "log") + ": " + Object.keys(m.series).length + " columns, "
      + matched + " matched to the model";
  }
  else if (m.type === "error") { foot.textContent = "error: " + m.error; }
});

document.getElementById("srcnote").textContent =
  "Trajectories from modelica.sim (the reference tier). The rings mark the model's recorded reference points; the line is the simulation passing through them. Same chart engine as the notebook widget (modelica.sim.view).";

function load() {
  document.body.classList.remove("single");
  buildRail();
  select(0);
}
load();
</script>
