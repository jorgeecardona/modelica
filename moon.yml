# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# modelica — Modelica/FMI/SSP toolchain. Single project at the repo root. Every task runs
# as a system command via `uv run` (see .moon/toolchain.yml for why moon's Python toolchain
# is not used). CI runs one `moon run :ci` (or `:release` on main); moon owns all task
# ordering instead of hand-wired GitLab stages/needs.
id: 'modelica'
layer: 'library'
language: 'python'

tasks:
  # Everything, not just src and tests: the pre-commit hook lints whatever Python is staged,
  # and a hook stricter than CI is a hook people learn to pass with --no-verify. The examples
  # and the notebooks have their own per-file-ignores in pyproject.
  lint:
    command: 'uv run ruff check src tests examples docs/notebooks'
    inputs: ['src/**/*.py', 'tests/**/*.py', 'examples/**/*.py', 'docs/notebooks/*.py', 'pyproject.toml']

  format-check:
    command: 'uv run ruff format --check src tests examples docs/notebooks'
    inputs: ['src/**/*.py', 'tests/**/*.py', 'examples/**/*.py', 'docs/notebooks/*.py', 'pyproject.toml']

  typecheck:
    command: 'uv run pyright'
    inputs: ['src/**/*.py', 'tests/**/*.py', 'pyproject.toml']

  test:
    command: 'uv run pytest -q'
    inputs: ['src/**/*.py', 'tests/**/*.py', 'pyproject.toml']

  # The floor named in pyproject's `requires-python = ">=3.12"`, run rather than asserted.
  # A claimed floor nobody executes is fiction (the lesson from pytest-parallex, where the
  # python floor had never once been run). ~10s, and it also proves the core imports with
  # no optional numerics installed. Keep the version here equal to `requires-python`.
  test-python-floor:
    command: 'uv run --isolated --python 3.12 --with-editable . --with pytest --with numpy --with scipy pytest -q'
    inputs: ['src/**/*.py', 'tests/**/*.py', 'pyproject.toml']

  # `build(system, jit=True)` compiles the emitted module with Numba, and until this task
  # existed nothing ever ran it. Isolated, and Numba named here rather than in pyproject:
  # it pins `numpy<2.5` while this project runs 2.5, and uv locks one resolution across every
  # extra, so merely *declaring* it rolled the whole lock -- dev environment included -- back
  # a numpy minor. The long version is in pyproject where the extra would have gone. numpy
  # resolves down inside this throwaway environment and nowhere else, and `tests/test_jit.py`
  # skips itself in the normal one, which is why running it there is not enough.
  test-jit:
    command: >-
      uv run --isolated --with-editable . --with pytest --with numpy --with scipy
      --with numba pytest -q tests/test_jit.py
    inputs: ['src/**/*.py', 'tests/test_jit.py', 'examples/models/*', 'pyproject.toml']

  # Work-precision, not a gate. `docs/ideas/benchmarks.md` argues the shape and
  # `docs/issues` records why this is deliberately not in `ci`: a timing on a shared runner
  # is noise, and a flaky performance gate teaches people to ignore the pipeline. Somebody
  # runs this and records the number with the machine beside it.
  bench:
    command: 'uv run --extra sim python -u scripts/bench.py --out bench.json'
    options:
      cache: false
      runInCI: false

  # The same diagram with the fused loop's column on it. Separate because numba cannot be
  # installed beside this project's numpy -- the long version is in `pyproject.toml` -- so it
  # needs the same throwaway environment `test-jit` uses. `scripts/bench.py` drops the column
  # rather than failing when numba is absent, which is why `:bench` above still runs.
  bench-fused:
    command: >-
      uv run --isolated --with-editable . --with numpy --with scipy --with numba
      python -u scripts/bench.py --out bench-fused.json
    options:
      cache: false
      runInCI: false

  # Reachability and agreement over the Modelica Standard Library, not a gate. The number
  # moves as language coverage moves, and gating on it would make a green pipeline a matter
  # of taste -- the reachability-and-agreement entry in `docs/issues` argues this at length.
  # Somebody runs this and records the two numbers in the docs with the date and the MSL
  # version beside them, the way `:bench` timings are recorded with the machine.
  coverage:
    command: 'uv run --extra sim python -u scripts/coverage.py --out coverage.json'
    options:
      cache: false
      runInCI: false

  # The notebooks under docs/notebooks import the package and run it, so the numerics and the
  # model checker have to be here too -- this task builds the docs *and* executes them, which
  # is why `src/**/*.py` and `examples/**/*` are inputs: a change to either can break a page.
  docs:
    command: 'uv run --extra docs --extra sim --extra verify mkdocs build --strict'
    inputs:
      - 'docs/**/*'
      - 'examples/**/*'
      - 'src/**/*.py'
      - 'mkdocs.yml'
      - 'README.md'
      - 'CHANGELOG.md'
    outputs: ['site']

  build:
    command: 'uv build --out-dir dist'
    deps: ['~:test']
    inputs: ['src/**/*.py', 'pyproject.toml', 'hatch_build.py', 'engine/src/**/*', 'README.md', 'CHANGELOG.md', 'LICENSE']
    outputs: ['dist']

  # CI-side enforcement of "a src/ change carries a version bump" (the non-bypassable
  # counterpart to the pre-commit auto-bump). Reads the diff base from CI env, so it is
  # git-state dependent, not file-input dependent -> not cacheable.
  version-guard:
    command: 'sh scripts/ci-version-guard'
    options:
      cache: false

  # The origin/main-anchored guard: HEAD's version must be strictly greater than
  # main's whenever src/ python differs from main. Complements version-guard (which
  # checks a bump landed within the CI diff range) with "ahead of main", the invariant
  # behind "every push carries a new patch". Fetches origin/main, so not cacheable.
  version-ahead:
    command: 'sh scripts/check-version-ahead'
    options:
      cache: false

  # The single aggregate gate: the whole CI check graph in one target.
  # format-check IS in the gate — the tree is a fresh rewrite, so it starts format-clean
  # and gating it from day one beats retrofitting it later (musil's lesson).
  ci:
    command: 'noop'
    deps:
      - '~:lint'
      - '~:format-check'
      - '~:typecheck'
      - '~:test'
      - '~:test-python-floor'
      - '~:test-jit'
      - '~:build'
      - '~:docs'
      - '~:version-guard'
      - '~:version-ahead'

  # Mint a PyPI OIDC token and upload dist/*. Invoked by release (or by hand).
  publish:
    command: 'sh scripts/pypi-publish'
    deps: ['~:build']
    options:
      cache: false
      runInCI: false

  # main-only: no-op if pyproject's version is already on PyPI; else publish.
  # Invoked explicitly by the CI job on the default branch (`moon run :release`), so it
  # MUST be runnable in CI -- do NOT set runInCI:false here (that makes `:release` resolve
  # to "no tasks found" under CI). It is never part of `:ci`, so it only runs when targeted.
  release:
    command: 'sh scripts/release'
    deps: ['~:ci']
    options:
      cache: false
