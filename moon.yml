# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# modelica — Modelica/FMI/SSP toolchain. Single project at the repo root. Every task runs
# as a system command via `uv run` (see .moon/toolchain.yml for why moon's Python toolchain
# is not used). CI runs one `moon run :ci` (or `:release` on main); moon owns all task
# ordering instead of hand-wired GitLab stages/needs.
id: 'modelica'
layer: 'library'
language: 'python'

tasks:
  lint:
    command: 'uv run ruff check src tests'
    inputs: ['src/**/*.py', 'tests/**/*.py', 'pyproject.toml']

  format-check:
    command: 'uv run ruff format --check src tests'
    inputs: ['src/**/*.py', 'tests/**/*.py', 'pyproject.toml']

  typecheck:
    command: 'uv run pyright'
    inputs: ['src/**/*.py', 'tests/**/*.py', 'pyproject.toml']

  test:
    command: 'uv run pytest -q'
    inputs: ['src/**/*.py', 'tests/**/*.py', 'pyproject.toml']

  # The floor named in pyproject's `requires-python = ">=3.11"`, run rather than asserted.
  # A claimed floor nobody executes is fiction (the lesson from pytest-parallex, where the
  # python floor had never once been run). ~10s, and it also proves the core imports with
  # no optional numerics installed.
  test-python-floor:
    command: 'uv run --isolated --python 3.11 --with-editable . --with pytest --with numpy --with scipy pytest -q'
    inputs: ['src/**/*.py', 'tests/**/*.py', 'pyproject.toml']

  docs:
    command: 'uv run --extra docs mkdocs build --strict'
    inputs: ['docs/**/*', 'mkdocs.yml', 'README.md', 'CHANGELOG.md']
    outputs: ['site']

  build:
    command: 'uv build --out-dir dist'
    deps: ['~:test']
    inputs: ['src/**/*.py', 'pyproject.toml', 'README.md', 'CHANGELOG.md', 'LICENSE']
    outputs: ['dist']

  # CI-side enforcement of "a src/ change carries a version bump" (the non-bypassable
  # counterpart to the pre-commit auto-bump). Reads the diff base from CI env, so it is
  # git-state dependent, not file-input dependent -> not cacheable.
  version-guard:
    command: 'sh scripts/ci-version-guard'
    options:
      cache: false

  # The single aggregate gate: the whole CI check graph in one target.
  # format-check IS in the gate — the tree is a fresh rewrite, so it starts format-clean
  # and gating it from day one beats retrofitting it later (musil's lesson).
  ci:
    command: 'noop'
    deps:
      - '~:lint'
      - '~:format-check'
      - '~:typecheck'
      - '~:test'
      - '~:test-python-floor'
      - '~:build'
      - '~:docs'
      - '~:version-guard'

  # Mint a PyPI OIDC token and upload dist/*. Invoked by release (or by hand).
  publish:
    command: 'sh scripts/pypi-publish'
    deps: ['~:build']
    options:
      cache: false
      runInCI: false

  # main-only: no-op if pyproject's version is already on PyPI; else publish.
  # Invoked explicitly by the CI job on the default branch (`moon run :release`), so it
  # MUST be runnable in CI -- do NOT set runInCI:false here (that makes `:release` resolve
  # to "no tasks found" under CI). It is never part of `:ci`, so it only runs when targeted.
  release:
    command: 'sh scripts/release'
    deps: ['~:ci']
    options:
      cache: false
