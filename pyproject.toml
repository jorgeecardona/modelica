[project]
# modelica — a Modelica/FMI/SSP toolchain for Python: parse Modelica, flatten it to a
# DAE, simulate it (on a precompiled Rust engine where the wheel has one, else SciPy), and interoperate with the two Modelica Association exchange standards
# (FMI 3.0 for single components, SSP 2.0 for systems of them).
#
# The distribution name is `modelica`, not `pymodelica`: PyPI's `pymodelica` is held by an
# abandoned Modelon/JModelica.org upload (version "trunk"). The git repo keeps the
# historical name; the import package matches the distribution.
name = "modelica"
dynamic = ["version"]  # the single source of truth is __version__ in src/modelica/__init__.py (see [tool.hatch.version])
description = "Modelica toolchain for Python: parse, flatten, simulate on a precompiled engine, and exchange via FMI 3.0 and SSP 2.0"
readme = "README.md"
# 3.12+, no compatibility shims: this is a full rewrite of a 2010 Python 2 codebase, and
# the modelling layer leans on the modern typing surface (Self, StrEnum, exception groups
# for multi-error diagnostics, tomllib) rather than back-porting it. The floor is 3.12 and
# not 3.11 because of the `sim` extra: NumPy 2.4 requires 3.12 itself, and its stubs spell
# `ArrayLike` with `collections.abc.Buffer` -- a name that does not exist earlier, and
# without which every array argument in this package types as partially unknown.
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jorge Cardona", email = "jorgeecardona@gmail.com" }]
keywords = [
    "modelica",
    "fmi",
    "fmu",
    "ssp",
    "simulation",
    "dae",
    "co-simulation",
    "digital-twin",
    "system-modeling",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# One `pip install modelica` simulates. NumPy carries every array the engine and the
# results use; SciPy is the fallback integrator where no engine wheel exists. The parser,
# the IR and the FMI/SSP layers still import neither, so `import modelica.lang` stays cheap.
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[project.optional-dependencies]
# Kept so `pip install "modelica[sim]"` and `uv sync --extra sim` still work: NumPy and SciPy
# are plain dependencies now. The SUNDIALS IDA binding for real (index-1) DAEs stays an extra
# because it needs a compiled SUNDIALS.
sim = []
sundials = ["scikit-sundae>=1.0"]
# Model-checking the discrete half of a model (`modelica.verify`). An extra rather than a
# dev-only tool because "does this model's event iteration converge?" is a question about
# *your* model, not about this package's tests -- but it stays out of the base install,
# because a simulator that cannot run without a model checker would be an odd thing.
verify = ["musil>=0.7"]
#
# docs are an *extra* (not a uv dependency-group) so external services can install them via pip.
# The notebooks under docs/notebooks are *executed* at build time, which is what stops them
# rotting: a page that stopped working fails `mkdocs build --strict` in CI rather than sitting
# there showing output from a version of the code that no longer exists.
#
# Two formats, on purpose. The narrative pages are `.py` in jupytext percent format, so their
# diffs are readable and nothing but source is ever committed. The `.ipynb` ones are the pages
# a reader is meant to *open and run*: matplotlib figures the library will not grow a
# dependency to draw, and ipywidgets sliders that need a live kernel. They are committed with
# their outputs stripped, so they diff like the percent files and cannot show stale results.
#
# matplotlib and ipywidgets are docs-only for the reason stated in `modelica.sim.view`: a
# result renders its own chart in vanilla JavaScript so that the *library* needs neither. Here
# we are the notebook, not the library, and a phase portrait wants a plotting library.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-jupyter>=0.25",
    "jupytext>=1.16",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "matplotlib>=3.9",
]

[project.urls]
Homepage = "https://gitlab.com/cardona-oss/pymodelica"
Repository = "https://gitlab.com/cardona-oss/pymodelica"
Issues = "https://gitlab.com/cardona-oss/pymodelica/-/issues"
Changelog = "https://gitlab.com/cardona-oss/pymodelica/-/blob/main/CHANGELOG.md"
Documentation = "https://cardona-oss.gitlab.io/pymodelica/"

[tool.uv]
# After the pre-commit hook auto-bumps __version__ in the package __init__, uv must treat the
# editable install as stale and reinstall it; without the __init__ key the next `make check`
# runs against the old version. (pyproject is already an implicit key; __init__ is the version source.)
cache-keys = [{ file = "pyproject.toml" }, { file = "src/modelica/__init__.py" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version lives as __version__ in the package itself; hatchling reads it (by regex, no import) so
# pyproject and the runtime never disagree. scripts/bump-version rewrites that literal.
path = "src/modelica/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/modelica"]

# Compiles engine/ into the wheel as modelica/_engine.<suffix> when cargo is available, and
# tags the wheel py3-none-<platform>; without cargo the wheel stays pure. See hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "engine/Cargo.toml",
    "engine/Cargo.lock",
    "engine/src",
    "hatch_build.py",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright[nodejs]>=1.1.390",
    "pytest>=8",
    "pytest-cov>=6",
    "numpy>=2.0",
    "scipy>=1.13",
    "musil>=0.7",
    # Property-based testing, for `modelica.ir.causalize` only. `docs/ideas/verification.md`
    # argues that matching, BLT sorting and Pantelides are graph algorithms over unbounded
    # inputs, so a model checker is the wrong instrument and generated models are the right
    # one. Dev-only and not an extra: unlike `musil`, this answers a question about *this
    # package*, never about a caller's model.
    "hypothesis>=6.100",
    "pytest-parallex>=0.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: integrates, model-checks or compiles a whole corpus model. `make test` skips these; CI (`moon run :test`, `make test-all`) runs them.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Strict: everything on, each opt-out justified.
select = ["ALL"]
ignore = [
    "E501",    # line length is the formatter's job (line-length = 100)
    "COM812",  # trailing commas conflict with `ruff format` (ruff's own recommendation)
    "D1",      # not every helper owes a docstring; the ones that exist explain *why*
    "D401",    # docstrings here are narrative rationale, not imperative summaries
    "TRY003", "EM101", "EM102",  # inline exception messages; msg-variable style adds noise
    "CPY001",  # per-file copyright headers; LICENSE covers the repo
]

[tool.ruff.lint.per-file-ignores]
# `scripts/` holds things somebody runs, not modules something imports. A benchmark whose
# whole output is a table on stdout is the case: `print` is not a leftover here, it is the
# product. The numeric rules relax for the same reason -- a measurement takes the knobs it
# takes, and `scipy` and `Result` are typed loosely enough that `Any` at the boundary is
# honest rather than lazy.
"scripts/*.py" = [
    "INP001",  # a script is not part of a package; nothing imports it
    "T201",    # the table on stdout is what it is for
    "ANN401",  # `Result` and `scipy.sparse` have no stubs worth naming at the boundary
    "PLR0913", # a measurement takes a problem, a horizon, a method, a tolerance and a truth
    "PLR0917",
]

# The pages under docs/notebooks are notebooks -- either jupytext percent format, where
# `# %%` splits a `.py` into cells, or `.ipynb`. Both are executed by mkdocs-jupyter at build
# time. A notebook is a script read top to bottom, not a module, so the rules that keep
# modules tidy misread it.
"docs/notebooks/*" = [
    "INP001",  # a notebook is not part of a package; there is nothing to import it
    "T201",    # `print` is how a cell says something
    "E402",    # imports sit in the cell that first needs them, after the prose explaining why
    "A004",    # `from IPython.display import display` is IPython's own idiom; the "builtin"
               # it shadows is the one IPython injects, and that is exactly the intent
    "B018",    # a bare expression on the last line is how a cell displays a value
    # The rest are the plotting notebooks, where the figures are the output:
    "ANN",     # a helper defined in one cell and called in the next takes its types from the
               # cell above it; and matplotlib's own surface is only partly typed, so
               # spelling out `ax: Axes` buys no checking here (pyright reads src and tests)
    "RUF001", "RUF002",  # `26×26`, `√(x²+y²) − L`, `resistor–capacitor`: chart titles and
                         # prose are typeset, and the ambiguous-character rule is about
                         # identifiers being confusable, not about axis labels
    "RUF059",  # `fig, ax = plt.subplots()` is matplotlib's own idiom; renaming the figure
               # `_fig` in the cells that only touch the axes would be noise
    "PLR0913", "PLR0917",  # a direct-label helper takes an axes, a point, a string, a colour
                           # and a nudge -- six arguments that are six separate things.
                           # Bundling them into a dataclass to satisfy a counter would make
                           # every call site longer than the annotate() it replaced
]
# A command-line program says what it has to say on stdout. `print` is the interface,
# not a leftover debugging call.
"src/modelica/diagram/__main__.py" = ["T201"]
# Each example is the Python twin of a `.mo` file next to it, and the tests assert the two
# flatten to the same model. That correspondence outranks the house style: the docstring is
# the Modelica description string, the component names are the ones in the `.mo`.
"examples/*" = [
    "INP001",  # examples are read and run, not imported
    "T201",    # the `__main__` block prints the generated Modelica; that is the demo
    "D400",    # class docstrings become Modelica description strings, which take no period
    "ANN201",  # `def equations(self)` is the DSL's form; annotating 24 of them buys nothing
    "E741",    # `l` is the inductor, because `l` is the inductor in the `.mo` twin
    "SIM300",  # `self.E == kinetic + strain + contact` is not a comparison with a Yoda side.
               # `==` builds an equation here, the left-hand side is the variable it defines,
               # and swapping the operands writes a different `.mo` -- which the twin test
               # then reports as a mismatch with no obvious cause
]
"tests/*" = [
    "S101",    # asserts are the point of tests
    "PLR2004", # literal expectations in asserts are clearer than named constants
    "ARG",     # pytest fixture signatures are fixed; params can go unused
    # The simulation tests reach NumPy and `modelica.sim.solve` through an importorskip, so
    # the module and everything that comes out of it is `Any` by construction. Annotating
    # them properly would mean importing at module scope what the skip exists to avoid.
    "ANN401",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["modelica"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
# Kept equal to the `requires-python` floor: checking against a version the project does not
# claim to support proves nothing about the version it does. (The two disagreed briefly, and
# it showed -- read as 3.11, NumPy's `ArrayLike` refers to `collections.abc.Buffer`, which
# does not exist there, and every array argument in the package became partially unknown.)
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
