# modelica CI/CD -- a single moon-driven job.
#
# proto installs the pinned toolchain (.prototools: moon + uv); then ONE `moon run`
# orchestrates the whole task graph (lint, typecheck, test, build, docs, version-guard) --
# no per-language jobs, no hand-wired stages/needs, moon resolves the order. On the default
# branch it runs `:release` instead: the same `:ci` checks run as deps, then it publishes
# to PyPI via OIDC Trusted Publishing when pyproject's version isn't on PyPI yet (no
# stored API token). See README "Releasing".

default:
  image: debian:bookworm-slim

variables:
  UV_LINK_MODE: copy
  # version-guard diffs against a base older than a shallow clone would contain.
  GIT_DEPTH: "0"

# Avoid duplicate (branch + MR) pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

ci:
  # On the default branch the engine wheel is built first and published with the pure one.
  needs:
    - job: engine-wheel
      optional: true
    - job: engine-wheel-arm64
      optional: true
    - job: engine-wheel-windows
      optional: true
    - job: engine-wheel-macos
      optional: true
  # OIDC Trusted Publishing: GitLab mints a short-lived id_token; scripts/pypi-publish
  # exchanges it for a one-shot PyPI token. The `pypi` environment matches the PyPI
  # publisher config (it is also recorded on non-publishing runs -- cosmetic only).
  #
  # NOTE: the DISTRIBUTION is `modelica`; the repo is `pymodelica`. PyPI's pending-publisher
  # entry must name project `modelica`, namespace `jorgeecardona`, project `pymodelica`,
  # top-level pipeline file `.gitlab-ci.yml`, environment `pypi`.
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  # One ci job at a time: two pushes a minute apart both found the version missing on PyPI
  # and both uploaded it, and the second upload failed with "File already exists".
  resource_group: pypi
  environment:
    name: pypi
    url: https://pypi.org/project/modelica/
  # A hung notebook cell waits forever: mkdocs-jupyter builds the ExecutePreprocessor
  # config itself and never sets a timeout, so nbclient's default (None) applies. Without
  # a bound the job spends the whole hour and then reports "Kernel died", which describes
  # the runner tearing the process down rather than what actually stalled. 40 minutes is
  # comfortably above a healthy run (~6 minutes) and fails while the log still means
  # something.
  timeout: 40m
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - .venv
  before_script:
    # debian-slim is bare: bring what proto + pyright's bundled node (libatomic1) need.
    - apt-get update && apt-get install -y --no-install-recommends curl git ca-certificates unzip xz-utils bash libatomic1
    - export PATH="$HOME/.proto/bin:$HOME/.proto/shims:$PATH"
    # Fetch proto straight from its GitHub release. moonrepo.dev/install/proto.sh merely downloads
    # this tarball, and the runner's access to moonrepo.dev is flaky (curl SSL timeouts); GitHub is
    # reliable. `proto install` then pulls the pinned toolchain from each tool's own upstream — not
    # moonrepo.
    - mkdir -p "$HOME/.proto/bin" /tmp/proto && curl -fsSL "https://github.com/moonrepo/proto/releases/latest/download/proto_cli-x86_64-unknown-linux-gnu.tar.xz" -o /tmp/proto/p.tar.xz && tar xf /tmp/proto/p.tar.xz --strip-components 1 -C /tmp/proto && mv /tmp/proto/proto /tmp/proto/proto-shim "$HOME/.proto/bin/" && rm -rf /tmp/proto
    - proto install                       # moon + uv, pinned in .prototools
    - uv sync --frozen --extra docs       # ruff + pyright + pytest + numpy/scipy + mkdocs
  script:
    # One moon invocation owns all interdependence. `-c 1` (serial) sidesteps the proto
    # temp-rename race a parallel fan-out can hit; `proto install` above also pre-warmed
    # the cache. On main: `:release` runs the full `:ci` graph then publishes if the
    # version is new. Elsewhere (MRs/branches): checks only.
    - export PATH="$HOME/.proto/bin:$HOME/.proto/shims:$PATH"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        moon run :release -c 1
      else
        moon run :ci -c 1
      fi
  # `moon run :ci` already built the site (the `docs` task, strict, outputs `site/`), and
  # `pages` below publishes exactly that. Handing it over as an artifact is what stops the
  # site being built twice per pipeline.
  artifacts:
    paths:
      - site
    expire_in: 1 day

# The platform wheel: the same package with the engine (engine/) compiled into it as
# modelica/_engine.so, tagged py3-none-manylinux_2_28_x86_64 (hatch_build.py). Built in the PyPA
# manylinux image so the tag is true, then installed and tested. Only on the default branch,
# where `ci` publishes it next to the pure wheel; branches skip it to save CI minutes.
engine-wheel:
  image: quay.io/pypa/manylinux_2_28_x86_64
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 20m
  script:
    - curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
    - export PATH="$HOME/.cargo/bin:$PATH"
    - /opt/python/cp312-cp312/bin/python -m pip install --quiet uv
    - export PATH="/opt/python/cp312-cp312/bin:$PATH"
    - MODELICA_ENGINE=1 MODELICA_WHEEL_PLATFORM=manylinux_2_28_x86_64 uv build --wheel --out-dir dist-engine
    - uv venv --python /opt/python/cp312-cp312/bin/python /tmp/check
    - VIRTUAL_ENV=/tmp/check uv pip install "$(ls dist-engine/*.whl)[sim]" pytest
    # Out of the source tree, so the import is the installed wheel and not src/.
    - cd /tmp && /tmp/check/bin/python -c "from modelica.sim import engine; assert engine.installed(), 'no engine in the wheel'"
    - cd "$CI_PROJECT_DIR" && /tmp/check/bin/python -m pytest -q -p no:cacheprovider tests/test_vm.py -m "not slow" -k "engine"
  artifacts:
    paths:
      - dist-engine
    expire_in: 1 day

# The same wheel for Linux aarch64, built natively on GitLab's arm64 runner (cost factor 1).
engine-wheel-arm64:
  extends: engine-wheel
  image: quay.io/pypa/manylinux_2_28_aarch64
  tags: [saas-linux-small-arm64]
  variables:
    MODELICA_WHEEL_PLATFORM: manylinux_2_28_aarch64
  script:
    - curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
    - export PATH="$HOME/.cargo/bin:$PATH"
    - /opt/python/cp312-cp312/bin/python -m pip install --quiet uv
    - export PATH="/opt/python/cp312-cp312/bin:$PATH"
    - MODELICA_ENGINE=1 uv build --wheel --out-dir dist-engine
    - uv venv --python /opt/python/cp312-cp312/bin/python /tmp/check
    - VIRTUAL_ENV=/tmp/check uv pip install "$(ls dist-engine/*.whl)[sim]" pytest
    - cd /tmp && /tmp/check/bin/python -c "from modelica.sim import engine; assert engine.installed(), 'no engine in the wheel'"
    - cd "$CI_PROJECT_DIR" && /tmp/check/bin/python -m pytest -q -p no:cacheprovider tests/test_vm.py -m "not slow" -k "engine"

# The Windows wheel: the engine cross-compiled with mingw-w64 on Linux, then packed with
# MODELICA_ENGINE_LIBRARY. The engine does not link Python, so no Windows Python is needed.
# Not run on Windows here; the objdump line shows which DLLs it imports.
engine-wheel-windows:
  image: python:3.12-slim-bookworm
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 20m
  script:
    - apt-get update -qq && apt-get install -y -qq curl gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 >/dev/null
    - curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --target x86_64-pc-windows-gnu
    - export PATH="$HOME/.cargo/bin:$PATH"
    - cargo build --release --locked --target x86_64-pc-windows-gnu --manifest-path engine/Cargo.toml
    - export DLL=engine/target/x86_64-pc-windows-gnu/release/modelica_engine.dll
    - x86_64-w64-mingw32-objdump -p "$DLL" | grep "DLL Name"
    - "! x86_64-w64-mingw32-objdump -p \"$DLL\" | grep -iE 'libgcc|libwinpthread|libstdc'"
    - x86_64-w64-mingw32-objdump -p "$DLL" | grep -c md_vm_run
    - pip install --quiet uv
    - MODELICA_ENGINE_LIBRARY="$DLL" MODELICA_WHEEL_PLATFORM=win_amd64 uv build --wheel --out-dir dist-engine
    - python -m zipfile -l dist-engine/*.whl | grep "modelica/_engine.dll"
  artifacts:
    paths:
      - dist-engine
    expire_in: 1 day

# The macOS arm64 wheel. A Mac runner costs 6 times a Linux one, so this runs only when the
# version in src/modelica/__init__.py changes, which is when a release publishes.
engine-wheel-macos:
  image: macos-26-xcode-26
  tags: [saas-macos-medium-m1]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [src/modelica/__init__.py]
  timeout: 20m
  variables:
    MACOSX_DEPLOYMENT_TARGET: "11.0"
  script:
    - curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
    - export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - MODELICA_ENGINE=1 MODELICA_WHEEL_PLATFORM=macosx_11_0_arm64 uv build --wheel --out-dir dist-engine
    - uv venv --python 3.12 /tmp/check
    - VIRTUAL_ENV=/tmp/check uv pip install "$(ls dist-engine/*.whl)[sim]" pytest
    - cd /tmp && /tmp/check/bin/python -c "from modelica.sim import engine; assert engine.installed(), 'no engine in the wheel'"
    - cd "$CI_PROJECT_DIR" && /tmp/check/bin/python -m pytest -q -p no:cacheprovider tests/test_vm.py -m "not slow" -k "engine"
  artifacts:
    paths:
      - dist-engine
    expire_in: 1 day

# Publish the docs to GitLab Pages. A job named `pages` whose artifact is public/ is what
# GitLab serves.
#
# It publishes the site the `ci` job already built, and does not build its own. Two reasons,
# and the second one cost an hour of pipeline before it was noticed:
#
#   * The notebooks are *executed* at build time, which is the point -- a page that stopped
#     working fails the build. Executing them twice per pipeline buys nothing and doubles
#     the chance of hitting a stall.
#   * This job installed `--extra docs` while the gate installs `--extra docs --extra sim
#     --extra verify`. So the artifact GitLab served was built in an environment that
#     nothing gates, and a page could pass here and fail there, or the reverse.
#
# One build, in the gated environment, published from the artifact.
pages:
  needs: ["ci"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - test -d site || { echo "the ci job produced no site/ -- did the docs task run?"; exit 1; }
    - mv site public
  artifacts:
    paths:
      - public

# Publish the VS Code extension (editors/vscode) to the Visual Studio Marketplace, the same way
# the Python package goes to PyPI: automatically on the default branch, and only when the
# version is new. scripts/vsce-publish reads editors/vscode/package.json, asks the Marketplace
# what it already has, and publishes only if this push bumped the version -- so an ordinary main
# push is a no-op and a bump is a release, with no tag and no button. It gates on `ci`, so a
# broken tree does not publish, and takes the token from the VSCE_PAT CI/CD variable (the same
# variable and publisher, JorgeCardona, as the react-lens extension).
publish:vscode:
  image: node:22
  needs: ["ci"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - sh scripts/vsce-publish
  artifacts:
    paths:
      - editors/vscode/build/*.vsix
    expire_in: 30 days
  environment:
    name: marketplace
    url: https://marketplace.visualstudio.com/publishers/JorgeCardona
