[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "modelica-engine"
version = "0.1.0"
description = "The precompiled engine for modelica: runs a model as bytecode, with no compiler per model."
requires-python = ">=3.12"
license = "MIT"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]

[tool.maturin]
features = ["python"]
module-name = "modelica_engine"
