site_name: modelica
site_description: Pure-Python Modelica toolchain — parse, flatten, simulate, and exchange via FMI 3.0 and SSP 2.0.
site_url: https://cardona-oss.gitlab.io/pymodelica/
repo_url: https://gitlab.com/cardona-oss/pymodelica
repo_name: cardona-oss/pymodelica
copyright: MIT &copy; Jorge Cardona

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# nbconvert's HTML is laid out for JupyterLab, not for a page in a phone. Left alone it
# spends 76 px on an `In [1]:` gutter and clips every code line past 237 px with no way to
# scroll to the rest. This puts that right; see the file for what and why.
extra_css:
  - stylesheets/notebooks.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  # `mermaid` fences are drawn in the browser by the copy of mermaid that
  # mkdocs-material ships. That keeps a diagram as *text* in the page it explains, so it
  # diffs like prose and cannot go stale beside the words. `modelica.diagram` writes this
  # form with `to_mermaid()`, and writes SVG for everywhere else.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

plugins:
  - search
  # The notebooks are executed here, at build time. `allow_errors: false` means a cell that
  # raises fails the build -- which is the point: it makes the pages tests that happen to
  # render, so a documented API cannot quietly stop working.
  #
  # Both formats. The `.py` pages are jupytext percent notebooks -- source only, readable
  # diffs. The `.ipynb` pages are the ones meant to be opened and run: they carry matplotlib
  # figures and ipywidgets sliders, and they are committed with their outputs stripped, so
  # they diff like the percent files. The widget *state* in the built page is whatever
  # executing it here produced; the sliders only move again when a reader runs the notebook
  # against a kernel.
  #
  # Stripping the stored outputs does **not** mean a built page cannot show results from an
  # older version of the code -- an earlier version of this comment said it did, and it was
  # wrong. `mkdocs-jupyter` caches executed notebooks under `.cache/mkdocs-jupyter`, keyed on
  # the notebook, so editing `src/` and rebuilding re-renders the prose around output the
  # cache produced before the change. Measured 2026-08-10: 2.9 s warm and stale against 36 s
  # cold and correct. `make docs` drops that directory first and `make docs-prose` does not,
  # which is the whole difference between the two targets.
  #
  # `include_requirejs` is load-bearing, not decoration. The widget bundle nbconvert points at
  # (`@jupyter-widgets/html-manager/dist/embed-amd.js`) is an AMD module, so without a loader on
  # the page it dies with `ReferenceError: define is not defined` and every widget renders at
  # zero height -- an invisible gap where the prose promises sliders. With the flag: three
  # sliders at their stored values and the figure that state produced, and a clean console.
  - mkdocs-jupyter:
      execute: true
      allow_errors: false
      include: ["*.py", "*.ipynb"]
      include_source: true
      include_requirejs: true
      ignore_h1_titles: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Examples: examples.md
  - Finding where two tiers disagree: diverging.md
  - The precompiled engine: engine.md
  - The engine's virtual machine: engine-vm.md
  - The Rust backend, today: rust-backend.md
  - Notebooks:
      - Every model in the corpus: notebooks/gallery.ipynb
      - Simulating a model: notebooks/simulating.py
      - Drawing a model: notebooks/drawing.ipynb
      - Turning the knobs: notebooks/exploring.ipynb
      - Moving a parameter, with no kernel: notebooks/sweeping.ipynb
      - The shape of the equations: notebooks/structure.ipynb
      - Where the smoothness breaks: notebooks/events.ipynb
      - Roasting a batch: notebooks/roasting.ipynb
      - Enumerating the discrete half: notebooks/verifying.py
  - Ideas:
      - What else exists in Python: ideas/landscape.md
      - Reachability and agreement: ideas/coverage.md
      - Simplifying Modelica: ideas/simplifications.md
      - Drawing a graph: ideas/layout.md
      - Backends: ideas/backends.md
      - Benchmarks: ideas/benchmarks.md
      - PDEs: ideas/pdes.md
      - GPU backends: ideas/vulkan.md
      - Verification: ideas/verification.md
  - How these pages are written: style.md
  - Changelog: changelog.md
