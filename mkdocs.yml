site_name: modelica
site_description: Pure-Python Modelica toolchain — parse, flatten, simulate, and exchange via FMI 3.0 and SSP 2.0.
site_url: https://jorgeecardona.gitlab.io/pymodelica/
repo_url: https://gitlab.com/jorgeecardona/pymodelica
repo_name: jorgeecardona/pymodelica
copyright: MIT &copy; Jorge Cardona

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

plugins:
  - search
  # The notebooks are executed here, at build time. `allow_errors: false` means a cell that
  # raises fails the build -- which is the point: it makes the pages tests that happen to
  # render, so a documented API cannot quietly stop working.
  #
  # Both formats. The `.py` pages are jupytext percent notebooks -- source only, readable
  # diffs. The `.ipynb` pages are the ones meant to be opened and run: they carry matplotlib
  # figures and ipywidgets sliders, and they are committed with their outputs stripped, so
  # they diff like the percent files and cannot render results from an older version of the
  # code. The widget *state* in the built page is whatever executing it here produced; the
  # sliders only move again when a reader runs the notebook against a kernel.
  #
  # `include_requirejs` is load-bearing, not decoration. The widget bundle nbconvert points at
  # (`@jupyter-widgets/html-manager/dist/embed-amd.js`) is an AMD module, so without a loader on
  # the page it dies with `ReferenceError: define is not defined` and every widget renders at
  # zero height -- an invisible gap where the prose promises sliders. With the flag: three
  # sliders at their stored values and the figure that state produced, and a clean console.
  - mkdocs-jupyter:
      execute: true
      allow_errors: false
      include: ["*.py", "*.ipynb"]
      include_source: true
      include_requirejs: true
      ignore_h1_titles: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Examples: examples.md
  - Notebooks:
      - Simulating a model: notebooks/simulating.py
      - Turning the knobs: notebooks/exploring.ipynb
      - The shape of the equations: notebooks/structure.ipynb
      - Where the smoothness breaks: notebooks/events.ipynb
      - Roasting a batch: notebooks/roasting.ipynb
      - Enumerating the discrete half: notebooks/verifying.py
  - Ideas:
      - Backends: ideas/backends.md
      - Benchmarks: ideas/benchmarks.md
      - PDEs: ideas/pdes.md
      - GPU backends: ideas/vulkan.md
      - Verification: ideas/verification.md
  - Changelog: changelog.md
